schema = 1
kind = "kandelo-formula-build-inputs"
version = 3
disabled_formulae = ["erlang", "texlive"]

[profiles.kandelo-common]
profiles = []
kandelo_paths = [
  "crates/fork-instrument",
  "flake.lock",
  "flake.nix",
  "homebrew/kandelo-guest-layout.json",
  "libc",
  "scripts/homebrew-bottle-build.sh",
  "scripts/run-wasm-fork-instrument.sh",
  "sdk",
]
tap_paths = ["Kandelo/formula_support/kandelo_formula_support.rb"]
environment_policy = "kandelo-homebrew-build-v1"

