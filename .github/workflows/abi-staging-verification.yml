name: Verify and publish one ABI candidate receipt

on:
  workflow_call:
    inputs:
      coordination-artifact-id:
        required: true
        type: string
      coordination-artifact-digest:
        required: true
        type: string
      kandelo-head:
        required: true
        type: string
      kandelo-policy-commit:
        required: true
        type: string
      kandelo-repository:
        required: true
        type: string
      tap-commit:
        required: true
        type: string
      work-id:
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: verify-candidate ${{ inputs.work-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out exact Kandelo PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.kandelo-repository }}
          ref: ${{ inputs.kandelo-head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.kandelo-repository }}
          ref: ${{ inputs.kandelo-policy-commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Download exact protected coordination data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/coordination
          merge-multiple: true

      - name: Set up immutable Kandelo policy tools
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Verify one exact public candidate without credentials
        working-directory: kandelo-authority
        env:
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN \
            scripts/dev-shell.sh env \
              "PYTHONPATH=$GITHUB_WORKSPACE/tap-authority" \
            python3 -m scripts.abi_staging.cli execute-verification-work \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --out "$RUNNER_TEMP/verification"

      - name: Upload exact inert verification result
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-verification-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish:
    name: publish-receipt ${{ inputs.work-id }}
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Publish only a protected receipt reconstruction
        working-directory: tap-authority
        env:
          COORDINATION_ARTIFACT_DIGEST: ${{ inputs.coordination-artifact-digest }}
          COORDINATION_ARTIFACT_ID: ${{ inputs.coordination-artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PRODUCER_CONCLUSION: ${{ needs.verify.result }}
          TAP_COMMIT: ${{ inputs.tap-commit }}
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-receipt \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$TAP_COMMIT" \
            --work-id "$WORK_ID" \
            --coordination-artifact-id "$COORDINATION_ARTIFACT_ID" \
            --coordination-artifact-digest "$COORDINATION_ARTIFACT_DIGEST" \
            --producer-conclusion "$PRODUCER_CONCLUSION" \
            --handoff-artifact-id "$HANDOFF_ARTIFACT_ID" \
            --handoff-artifact-digest "$HANDOFF_ARTIFACT_DIGEST" \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/verification-publication.json"

      - name: Upload exact verification receipt locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-receipt-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
