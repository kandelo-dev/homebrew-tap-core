name: Verify and publish one ABI candidate receipt

on:
  workflow_call:
    inputs:
      coordination-artifact-id:
        required: true
        type: string
      coordination-artifact-digest:
        required: true
        type: string
      kandelo-head:
        required: true
        type: string
      kandelo-policy-commit:
        required: true
        type: string
      kandelo-repository:
        required: true
        type: string
      tap-commit:
        required: true
        type: string
      realm-artifact-id:
        required: true
        type: string
      realm-artifact-digest:
        required: true
        type: string
      realm-archive-sha256:
        required: true
        type: string
      realm-source-tree:
        required: true
        type: string
      work-id:
        required: true
        type: string
    secrets:
      HOMEBREW_GITHUB_PACKAGES_TOKEN:
        required: true

permissions: {}

jobs:
  verify:
    name: verify-candidate ${{ inputs.work-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out immutable Kandelo policy tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.kandelo-repository }}
          ref: ${{ inputs.kandelo-policy-commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Check out reviewed Homebrew implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Homebrew/brew
          ref: a92554a538e81fad0c5074443885dbcc4c36221d
          fetch-depth: 1
          persist-credentials: false
          path: homebrew-prefix/Homebrew

      - name: Download exact protected coordination data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/coordination
          merge-multiple: true

      - name: Download exact prepared Homebrew realm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.realm-artifact-id }}
          path: ${{ runner.temp }}/shared-realm
          merge-multiple: true

      - name: Set up immutable Kandelo policy tools
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Restore exact prepared Homebrew realm
        working-directory: kandelo-authority
        env:
          EXPECTED_REALM_ARTIFACT_DIGEST: ${{ inputs.realm-artifact-digest }}
          EXPECTED_REALM_ARCHIVE_SHA256: ${{ inputs.realm-archive-sha256 }}
          EXPECTED_REALM_COMMIT: ${{ inputs.kandelo-head }}
          EXPECTED_REALM_TREE: ${{ inputs.realm-source-tree }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REALM_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          scripts/dev-shell.sh bash \
            "$GITHUB_WORKSPACE/tap-authority/scripts/abi-staging-restore-homebrew-realm.sh" \
              --archive "$RUNNER_TEMP/shared-realm/shared-homebrew-realm.tar.zst" \
              --expected-archive-sha256 "$EXPECTED_REALM_ARCHIVE_SHA256" \
              --expected-commit "$EXPECTED_REALM_COMMIT" \
              --expected-tree "$EXPECTED_REALM_TREE" \
              --destination-root "$GITHUB_WORKSPACE/kandelo-source"

      - name: Export exact candidate verification identity
        working-directory: kandelo-authority
        env:
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          scripts/dev-shell.sh env \
            "PYTHONDONTWRITEBYTECODE=1" \
            "PYTHONSAFEPATH=1" \
            "PYTHONPATH=$GITHUB_WORKSPACE/tap-authority" \
            python3 -P -m scripts.abi_staging.cli export-verification-realm \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --github-env "$GITHUB_ENV"

      - name: Prepare exact uncredentialed Homebrew realm
        working-directory: kandelo-authority
        env:
          HOMEBREW_BREW_COMMIT: a92554a538e81fad0c5074443885dbcc4c36221d
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          candidate_workflow="$GITHUB_WORKSPACE/tap-authority/.github/workflows/abi-staging-candidate.yml"
          realm_script="$RUNNER_TEMP/abi-staging-prepare-homebrew-realm.sh"
          awk '
            /^      - name: Prepare exact uncredentialed Homebrew realm$/ {
              step = 1
              next
            }
            step && /^        run: \|$/ {
              body = 1
              next
            }
            body && /^      - name: / { exit }
            body {
              if (length($0) != 0 && substr($0, 1, 10) != "          ") {
                exit 2
              }
              sub(/^          /, "")
              print
            }
          ' "$candidate_workflow" >"$realm_script"
          test -s "$realm_script"
          # shellcheck disable=SC2016
          grep -Fq 'realm_root="$(mktemp -d /tmp/k.XXXXXX)"' "$realm_script"
          # shellcheck disable=SC2016
          grep -Fq 'echo "HOMEBREW_BREW_FILE=$brew_bin"' "$realm_script"
          chmod 0500 "$realm_script"
          bash "$realm_script"

      - name: Verify one exact public candidate without credentials
        working-directory: kandelo-authority
        env:
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN \
            scripts/dev-shell.sh env \
              "HOMEBREW_BREW_FILE=$HOMEBREW_BREW_FILE" \
              "HOMEBREW_BREW_COMMIT=$HOMEBREW_BREW_COMMIT" \
              "HOMEBREW_CACHE=$HOMEBREW_CACHE" \
              "HOMEBREW_TEMP=$HOMEBREW_TEMP" \
              "HOMEBREW_NO_AUTO_UPDATE=$HOMEBREW_NO_AUTO_UPDATE" \
              "HOMEBREW_NO_INSTALL_CLEANUP=$HOMEBREW_NO_INSTALL_CLEANUP" \
              "HOMEBREW_NO_ANALYTICS=$HOMEBREW_NO_ANALYTICS" \
              "HOMEBREW_DEVELOPER=$HOMEBREW_DEVELOPER" \
              "KANDELO_HOMEBREW_RESOLVED_TAPS_FILE=$KANDELO_HOMEBREW_RESOLVED_TAPS_FILE" \
              "KANDELO_HOMEBREW_TAP_SOURCE_COMMIT=$KANDELO_HOMEBREW_TAP_SOURCE_COMMIT" \
              "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
              "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
              "WASM_POSIX_XTASK_BIN=$WASM_POSIX_XTASK_BIN" \
              "PYTHONDONTWRITEBYTECODE=1" \
              "PYTHONSAFEPATH=1" \
              "PYTHONPATH=$GITHUB_WORKSPACE/tap-authority" \
            python3 -P -m scripts.abi_staging.cli execute-verification-work \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --out "$RUNNER_TEMP/verification"

      - name: Upload exact inert verification result
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-verification-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish:
    name: publish-receipt ${{ inputs.work-id }}
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: "1.3.3"

      - name: Publish only a protected receipt reconstruction
        working-directory: tap-authority
        env:
          COORDINATION_ARTIFACT_DIGEST: ${{ inputs.coordination-artifact-digest }}
          COORDINATION_ARTIFACT_ID: ${{ inputs.coordination-artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_PACKAGES_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ vars.HOMEBREW_GITHUB_PACKAGES_USER }}
          PRODUCER_CONCLUSION: ${{ needs.verify.result }}
          TAP_COMMIT: ${{ inputs.tap-commit }}
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-receipt \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$TAP_COMMIT" \
            --work-id "$WORK_ID" \
            --coordination-artifact-id "$COORDINATION_ARTIFACT_ID" \
            --coordination-artifact-digest "$COORDINATION_ARTIFACT_DIGEST" \
            --producer-conclusion "$PRODUCER_CONCLUSION" \
            --handoff-artifact-id "$HANDOFF_ARTIFACT_ID" \
            --handoff-artifact-digest "$HANDOFF_ARTIFACT_DIGEST" \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/verification-publication.json"

      - name: Upload exact verification receipt locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-receipt-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
