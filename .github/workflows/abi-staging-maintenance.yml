name: Maintain exact ABI staging records

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Exact bounded maintenance operation"
        required: true
        type: choice
        options:
          - authorize-capture
          - accept-artifact-risk
          - retry-exhausted
      evidence_artifact_id:
        description: "Numeric ID of protected reconciliation evidence"
        required: true
        type: string
      evidence_sha256:
        description: "Exact SHA-256 digest reported for that artifact"
        required: true
        type: string
      justification:
        description: "Bounded public reason for this exact maintenance action"
        required: true
        type: string

permissions: {}

concurrency:
  group: abi-staging-maintenance-${{ inputs.command }}-${{ inputs.evidence_artifact_id }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out protected tap main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate authority and record exact maintenance
        working-directory: tap-authority
        env:
          AUTHORIZATION_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          JUSTIFICATION: ${{ inputs.justification }}
          MAINTENANCE_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.override "$MAINTENANCE_COMMAND" \
            --evidence-artifact-id "$EVIDENCE_ARTIFACT_ID" \
            --evidence-sha256 "$EVIDENCE_SHA256" \
            --justification "$JUSTIFICATION" \
            --actor "$GITHUB_ACTOR" \
            --authorization-reference "$AUTHORIZATION_REFERENCE" \
            --verify-actor-permission \
            --immutable
