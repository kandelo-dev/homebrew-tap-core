name: Validate flat Homebrew selections

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "Kandelo/selections/**"
  push:
    branches: [main]
    paths:
      - "Kandelo/selections/**"
      - ".github/workflows/selection-checks.yml"

permissions:
  contents: read

jobs:
  selections:
    name: canonical flat selections
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate tap data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: tap-candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Check out trusted Kandelo validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Automattic/kandelo
          ref: 8c35674df2f09fd1adca171ab90cd424bee8e5af
          path: kandelo-validator
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install trusted validator dependencies
        run: npm --prefix kandelo-validator ci --no-audit --no-fund

      - name: Validate every checked-in selection
        shell: bash
        run: |
          set -euo pipefail
          selection_root="tap-candidate/Kandelo/selections"
          [[ -d "$selection_root" && ! -L "$selection_root" ]]

          selections=()
          while IFS= read -r -d '' candidate; do
            [[ -f "$candidate" && ! -L "$candidate" && "$candidate" == *.json ]] || {
              echo "selection inventory contains a non-JSON regular file: $candidate" >&2
              exit 1
            }
            selections+=("$candidate")
          done < <(find "$selection_root" -mindepth 1 -maxdepth 1 -print0 | sort -z)
          (( ${#selections[@]} > 0 ))

          for selection in "${selections[@]}"; do
            kandelo-validator/node_modules/.bin/tsx \
              kandelo-validator/scripts/homebrew-validate-flat-selection.ts \
              --selection "$selection" --expected-abi 42
          done
