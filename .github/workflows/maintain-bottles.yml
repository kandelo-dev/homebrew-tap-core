name: Publish Kandelo Bash rebuild 5

on:
  repository_dispatch:
    types: [publish-kandelo-bash-rebuild5]

jobs:
  publish-bash-rebuild5:
    permissions:
      actions: read
      contents: write
      packages: write
    # WHY: 3545 is the reviewed publisher descendant that accepts an exact tap
    # commit. The fork fix is a separate product descendant and is selected as
    # build input below rather than replacing the hardened workflow code.
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@3545bfd34509a52b68a4620c92e4aae24c60adb0
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: 6d923c6454dd7174082f25c3d3991d03f86f5ddb
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      # WHY: this preceding commit owns the rebuild-5 Formula reservation. The
      # caller commit is intentionally later, so it can pin the exact source
      # without a self-reference or an event-selected Formula snapshot.
      tap-ref: 73825368747f3378e3c8d49badcb1b8f36cb95de
      formulae: bash
      arches: wasm32
      release-tag: bottles-abi-v42
      expected-cache-keys: '{"bash":{"wasm32":"1d813d7f9db4979fc5c0eef6b37e213cb73a42395757cc92ef8ebeee2e62913d"}}'
      force: true
      dry-run: false
      require-vfs-acceptance: false
      # WHY: Bash must consume the exact 15-package generation staged from the
      # fork-correct source. Reusing ABI 42's earlier generation would silently
      # rebuild the broken continuation instrumentation.
      prepublication-staging-tag: pr-1094-staging
      prepublication-staging-kandelo-sha: 6d923c6454dd7174082f25c3d3991d03f86f5ddb
      defer-vfs-acceptance-until-postpublication: false
