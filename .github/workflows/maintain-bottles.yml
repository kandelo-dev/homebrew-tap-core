name: Maintain Kandelo bottles

on:
  repository_dispatch:
    types: [maintain-kandelo-bottles]

jobs:
  maintain:
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-maintenance.yml@880e5be7d2dbd3772602ff7eaed952c0b8c6608f
    with:
      mode: ${{ github.event.client_payload.mode || 'rebuild' }}
      # WHY: rebuild maintenance must use the same main-admitted publisher and
      # package closure as first publication. Rollback ignores these build
      # inputs inside the reusable workflow.
      kandelo-ref: 880e5be7d2dbd3772602ff7eaed952c0b8c6608f
      # WHY: maintenance must rebuild or roll back the exact reviewed Formula
      # source, even though repository_dispatch loads this caller from main.
      tap-ref: ${{ github.event.client_payload.tap_sha }}
      formulae: ${{ github.event.client_payload.formulae }}
      arches: ${{ github.event.client_payload.arches || 'wasm32' }}
      release-tag: ${{ github.event.client_payload.release_tag || '' }}
      expected-cache-keys: ${{ github.event.client_payload.expected_cache_keys || '' }}
      package-generation-wasm32: package-generation-rootfs-wasm32-abi-v42-sha256-b3d53ea330cfd0dbe53d4859c583df75bb15139a14fc7626468be9c442651018
      force: ${{ github.event.client_payload.force || false }}
      rollback-reason: ${{ github.event.client_payload.rollback_reason || '' }}
      rollback-ref: ${{ github.event.client_payload.rollback_ref || '' }}
      deleted-package-url: ${{ github.event.client_payload.deleted_package_url || '' }}
      deletion-reason: ${{ github.event.client_payload.deletion_reason || '' }}
