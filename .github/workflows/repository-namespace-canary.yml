# Publish one actual child from a successful protected-main dry run. This
# separate event has no campaign authority and cannot publish an index or edit
# Formula state; the reusable workflow also requires the package to be absent.
name: Publish first libyaml GHCR child

on:
  repository_dispatch:
    types: [publish-first-homebrew-child]

jobs:
  first-publication:
    permissions:
      actions: read
      contents: read
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-repository-namespace-canary.yml@d0c70caae68dd3c69632dea9f145a3bf31b499b8
    with:
      kandelo-ref: d0c70caae68dd3c69632dea9f145a3bf31b499b8
      tap-ref: ${{ github.sha }}
      formula: libyaml
      arch: wasm32
      dry-run-run-id: ${{ github.event.client_payload.dry_run_run_id }}
      dry-run-run-attempt: ${{ github.event.client_payload.dry_run_run_attempt }}
      dry-run-child-artifact-digest: ${{ github.event.client_payload.dry_run_child_artifact_digest }}
      expected-child-manifest-digest: ${{ github.event.client_payload.expected_child_manifest_digest }}
