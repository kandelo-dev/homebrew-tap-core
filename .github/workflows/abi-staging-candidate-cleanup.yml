name: Retain and tombstone ABI staging candidates

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Retention-expiry cleanup or an authorized immediate purge
        required: true
        type: choice
        default: ordinary
        options:
          - ordinary
          - immediate-purge
      target_reference:
        description: Optional exact digest reference for a manual run
        required: false
        type: string
        default: ""
      reason_category:
        description: Closed reason category; ordinary runs use retention-expired
        required: true
        type: choice
        default: retention-expired
        options:
          - retention-expired
          - malicious-object
          - legal-removal
          - pathological-size
      justification:
        description: Required bounded explanation for immediate purge
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: abi-staging-candidate-cleanup
  cancel-in-progress: false

jobs:
  plan-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      has-work: ${{ steps.plan.outputs.has_work }}
      tap-commit: ${{ steps.plan.outputs.tap_commit }}
    steps:
      - name: Check out protected tap main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Plan one bounded exact cleanup batch
        id: plan
        working-directory: tap-authority
        env:
          AUTHORIZATION_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CLEANUP_MODE: ${{ inputs.mode || 'ordinary' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          JUSTIFICATION: ${{ inputs.justification || '' }}
          REASON_CATEGORY: ${{ inputs.reason_category || 'retention-expired' }}
          TARGET_REFERENCE: ${{ inputs.target_reference || '' }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cleanup plan-live \
            --tap-root "$PWD" \
            --repository "$GITHUB_REPOSITORY" \
            --mode "$CLEANUP_MODE" \
            --target-reference "$TARGET_REFERENCE" \
            --reason-category "$REASON_CATEGORY" \
            --justification "$JUSTIFICATION" \
            --actor "$GITHUB_ACTOR" \
            --authorization-reference "$AUTHORIZATION_REFERENCE" \
            --verify-actor-permission \
            --enumerate-public-records \
            --recheck-lifecycle \
            --grace-days 30 \
            --batch-size 16 \
            --out "$RUNNER_TEMP/abi-staging-cleanup-plan" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload exact cleanup plan
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-cleanup-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abi-staging-cleanup-plan
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  delete-candidates:
    needs: plan-cleanup
    if: needs.plan-cleanup.outputs.has-work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out exact protected cleanup code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan-cleanup.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download exact cleanup plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan-cleanup.outputs.artifact-id }}
          path: ${{ runner.temp }}/abi-staging-cleanup-plan

      - name: Recheck, delete one exact version, and publish its tombstone
        working-directory: tap-authority
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PLAN_ARTIFACT_DIGEST: ${{ needs.plan-cleanup.outputs.artifact-digest }}
          PLAN_ARTIFACT_ID: ${{ needs.plan-cleanup.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cleanup execute-live \
            --tap-root "$PWD" \
            --repository "$GITHUB_REPOSITORY" \
            --plan "$RUNNER_TEMP/abi-staging-cleanup-plan/plan.json" \
            --plan-artifact-id "$PLAN_ARTIFACT_ID" \
            --plan-artifact-digest "$PLAN_ARTIFACT_DIGEST" \
            --recheck-live \
            --one-exact-version \
            --anonymous-absence \
            --immutable-tombstone \
            --batch-size 16 \
            --out "$RUNNER_TEMP/abi-staging-cleanup-result"

      - name: Upload exact cleanup result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-cleanup-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abi-staging-cleanup-result
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
          compression-level: 0
