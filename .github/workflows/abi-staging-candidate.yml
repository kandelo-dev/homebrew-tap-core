name: Build and publish one ABI candidate

on:
  workflow_call:
    inputs:
      coordination-artifact-id:
        required: true
        type: string
      coordination-artifact-digest:
        required: true
        type: string
      kandelo-head:
        required: true
        type: string
      kandelo-policy-commit:
        required: true
        type: string
      kandelo-repository:
        required: true
        type: string
      tap-commit:
        required: true
        type: string
      work-id:
        required: true
        type: string
    secrets:
      HOMEBREW_GITHUB_PACKAGES_TOKEN:
        required: true

permissions: {}

jobs:
  build:
    name: build-candidate ${{ inputs.work-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out exact Kandelo PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.kandelo-repository }}
          ref: ${{ inputs.kandelo-head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.kandelo-repository }}
          ref: ${{ inputs.kandelo-policy-commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Check out reviewed Homebrew implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Homebrew/brew
          ref: a92554a538e81fad0c5074443885dbcc4c36221d
          fetch-depth: 1
          persist-credentials: false
          path: homebrew-prefix/Homebrew

      - name: Download exact protected coordination data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/coordination
          merge-multiple: true

      - name: Set up immutable Kandelo policy tools
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Export exact candidate build identity
        working-directory: kandelo-authority
        env:
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          scripts/dev-shell.sh env \
            "PYTHONDONTWRITEBYTECODE=1" \
            "PYTHONPATH=$GITHUB_WORKSPACE/tap-authority" \
            python3 -m scripts.abi_staging.cli export-build-realm \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --github-env "$GITHUB_ENV"

      - name: Prepare exact uncredentialed Homebrew realm
        working-directory: kandelo-authority
        env:
          HOMEBREW_BREW_COMMIT: a92554a538e81fad0c5074443885dbcc4c36221d
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          realm_root="$(mktemp -d /tmp/k.XXXXXX)"
          test -d "$realm_root"
          test ! -L "$realm_root"
          chmod 0700 "$realm_root"
          mkdir -m 0700 "$realm_root/home"

          # Formula tests receive a sealed runtime projection from this
          # portable path. Keep its first-wave contents empty except for the
          # required real programs directory; candidate bottle bytes are
          # injected independently by the Formula test adapter.
          package_cache="$GITHUB_WORKSPACE/kandelo-source/.ci-test-binary-cache"
          test ! -e "$package_cache" && test ! -L "$package_cache"
          mkdir -m 0700 "$package_cache" "$package_cache/programs"
          test ! -e "$GITHUB_WORKSPACE/kandelo-source/binaries" && \
            test ! -L "$GITHUB_WORKSPACE/kandelo-source/binaries"
          mkdir -m 0700 "$GITHUB_WORKSPACE/kandelo-source/binaries"

          resolved_taps="$realm_root/resolved-taps.json"
          python3 scripts/homebrew-dependency-taps.py resolve \
            --tap-root "$GITHUB_WORKSPACE/tap-authority" \
            --tap-name "$KANDELO_ABI_STAGING_TAP_NAME" \
            --tap-repository "$KANDELO_ABI_STAGING_TAP_REPOSITORY" \
            --tap-commit "$KANDELO_ABI_STAGING_TAP_COMMIT" \
            --out "$resolved_taps"

          # Candidate jobs intentionally omit the production-only separate
          # Formula user, but still use the reviewed Brew implementation and
          # exact Kandelo toolchain without any GitHub write credential.
          # shellcheck disable=SC1091
          . scripts/homebrew-guest-layout.sh
          homebrew_select_guest_layout
          bash scripts/homebrew-prepare-host-prefix.sh \
            --layout-mode "$HOMEBREW_GUEST_LAYOUT_MODE" \
            --prefix "$HOMEBREW_GUEST_PREFIX"
          brew_repository="$GITHUB_WORKSPACE/homebrew-prefix/Homebrew"
          test "$(git -C "$brew_repository" rev-parse HEAD)" = \
            "$HOMEBREW_BREW_COMMIT"
          rm -f "$HOMEBREW_GUEST_PREFIX/bin/brew"
          ln -s "$brew_repository/bin/brew" \
            "$HOMEBREW_GUEST_PREFIX/bin/brew"
          brew_bin="$HOMEBREW_GUEST_PREFIX/bin/brew"
          test "$(readlink -f "$brew_bin")" = "$brew_repository/bin/brew"

          build_user="kandelo-homebrew-build"
          recipe_user="kandelo-homebrew-recipe"
          for reserved_user in "$build_user" "$recipe_user"; do
            if id "$reserved_user" >/dev/null 2>&1; then
              echo "reserved Homebrew identity already exists: $reserved_user" >&2
              exit 2
            fi
          done
          /usr/bin/sudo -n -- /usr/sbin/useradd --system --user-group \
            --create-home --home-dir "/home/$build_user" \
            --shell /usr/sbin/nologin "$build_user"
          /usr/bin/sudo -n -- /usr/sbin/useradd --system --user-group \
            --no-create-home --home-dir /nonexistent \
            --shell /usr/sbin/nologin "$recipe_user"
          shared_temp="$(mktemp -d /tmp/kandelo-homebrew.XXXXXX)"
          /usr/bin/sudo -n /usr/bin/chown root:root "$shared_temp"
          /usr/bin/sudo -n /usr/bin/chmod 1777 "$shared_temp"
          mkdir "$shared_temp/cache" "$shared_temp/tmp"

          # The tap-owned browser runners recover this exact directory from
          # dirname(HOMEBREW_CACHE)/ms-playwright after Homebrew isolates HOME
          # and strips the ordinary Playwright environment variable.
          playwright_browsers="$shared_temp/ms-playwright"
          cd "$GITHUB_WORKSPACE/kandelo-source"
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN -u GITHUB_ENV -u GITHUB_OUTPUT \
            -u GITHUB_STEP_SUMMARY \
            HOME="$realm_root/home" \
            scripts/dev-shell.sh env \
              "WASM_POSIX_BINARY_CACHE_ROOT=$package_cache" \
              "PLAYWRIGHT_BROWSERS_PATH=$playwright_browsers" \
              "KANDELO_ABI_STAGING_ARCHITECTURE=$KANDELO_ABI_STAGING_ARCHITECTURE" \
              bash -euo pipefail -s <<'BUILD_REALM'
          cd "$GITHUB_WORKSPACE/kandelo-source"
          bash scripts/build-musl.sh
          if [ "$KANDELO_ABI_STAGING_ARCHITECTURE" = wasm64 ]; then
            bash scripts/build-musl.sh --arch wasm64posix
          fi
          bash packages/registry/kernel/build-kernel.sh
          bash scripts/build-fork-instrument-tool.sh
          bash scripts/build-local-root-spill-tool.sh

          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo build --release -p xtask --target "$host" --quiet
          xtask="$PWD/target/$host/release/xtask"
          test -x "$xtask" && test ! -L "$xtask"
          formula_test_index="$PWD/target/$host/release/formula-test-program-packages.json"
          WASM_POSIX_DEPS_REGISTRY="$PWD/packages/registry" \
            "$xtask" build-deps program-index-selected \
              --source-repo-root "$PWD" \
              rootfs "$formula_test_index"
          test -f "$formula_test_index" && test ! -L "$formula_test_index"
          printf '%s\n' "$host" >"$RUNNER_TEMP/abi-staging-host-target"

          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix host ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix apps/browser-demos ci --no-audit --no-fund
          # The first candidate wave stages each tested Formula executable
          # into its own browser image. It needs an ABI-bound base filesystem,
          # not the legacy published rootfs/program package closure.
          cat >"$RUNNER_TEMP/abi-staging-empty-rootfs.ts" <<'EMPTY_ROOTFS'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          async function main(): Promise<void> {
            const root = process.argv[2];
            if (!root) throw new Error("Kandelo root is required");
            const memory = await import(
              pathToFileURL(join(root, "host/src/vfs/memory-fs.ts")).href
            );
            const abi = await import(
              pathToFileURL(join(root, "host/src/generated/abi.ts")).href
            );
            const fs = memory.MemoryFileSystem.create(
              new SharedArrayBuffer(2 * 1024 * 1024),
            );
            const image = await fs.saveImage({
              metadata: {
                version: 1,
                kernelAbi: abi.ABI_VERSION,
                createdBy: "abi-staging-candidate-formula-test",
              },
              normalizeTimestampsMs: 0,
            });
            writeFileSync(join(root, "host/wasm/rootfs.vfs"), image);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          EMPTY_ROOTFS
          node --experimental-wasm-exnref --import tsx/esm \
            "$RUNNER_TEMP/abi-staging-empty-rootfs.ts" "$PWD"
          command -v node >"$RUNNER_TEMP/abi-staging-node-bin"
          BUILD_REALM

          node_bin="$(cat "$RUNNER_TEMP/abi-staging-node-bin")"
          case "$node_bin" in
            /nix/store/*/bin/node) ;;
            *) echo "candidate realm resolved an undeclared Node: $node_bin" >&2; exit 2 ;;
          esac
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN -u GITHUB_ENV -u GITHUB_OUTPUT \
            -u GITHUB_STEP_SUMMARY \
            PATH="$PATH:/usr/sbin:/usr/bin:/sbin:/bin" \
            PLAYWRIGHT_BROWSERS_PATH="$playwright_browsers" \
            "$node_bin" \
              "$GITHUB_WORKSPACE/kandelo-source/apps/browser-demos/node_modules/playwright/cli.js" \
              install chromium --with-deps

          host_target="$(cat "$RUNNER_TEMP/abi-staging-host-target")"
          [[ "$host_target" =~ ^[A-Za-z0-9_.+-]+$ ]]
          candidate_xtask="$GITHUB_WORKSPACE/kandelo-source/target/$host_target/release/xtask"
          test -f "$candidate_xtask" && test ! -L "$candidate_xtask" && \
            test -x "$candidate_xtask"
          candidate_xtask_sha256="$(/usr/bin/sha256sum "$candidate_xtask")"
          candidate_xtask_sha256="${candidate_xtask_sha256%% *}"
          [[ "$candidate_xtask_sha256" =~ ^[0-9a-f]{64}$ ]]
          # WHY: Cargo may hard-link this release executable to its hashed
          # artifact on Linux. Homebrew preserves the checker path into Formula
          # tests, whose support loader accepts only a single-link, root-owned
          # immutable file. Copy-and-replace it after all realm setup and
          # before any Formula code executes.
          candidate_xtask_staged="$candidate_xtask.abi-staging-staged"
          test ! -e "$candidate_xtask_staged" && test ! -L "$candidate_xtask_staged"
          /usr/bin/sudo -n /usr/bin/install -o root -g root -m 0555 -- \
            "$candidate_xtask" "$candidate_xtask_staged"
          test "$(/usr/bin/stat -c '%u:%g:%a:%h' "$candidate_xtask_staged")" = \
            "0:0:555:1"
          test "$(/usr/bin/sha256sum "$candidate_xtask_staged" | /usr/bin/awk '{print $1}')" = \
            "$candidate_xtask_sha256"
          /usr/bin/sudo -n /usr/bin/mv -f -- "$candidate_xtask_staged" "$candidate_xtask"
          test "$(/usr/bin/stat -c '%u:%g:%a:%h' "$candidate_xtask")" = \
            "0:0:555:1"
          test "$(/usr/bin/sha256sum "$candidate_xtask" | /usr/bin/awk '{print $1}')" = \
            "$candidate_xtask_sha256"

          # Closed tap recipes are parsed once to derive the target dependency
          # graph before the privileged launcher creates its smaller platform
          # projection. Seal the exact tools and their directory ancestry now
          # so that parse observes the same immutable platform authority later
          # used for Formula execution.
          candidate_platform_tools=(
            "tools/bin/wasm-fork-instrument"
            "tools/bin/wasm-local-root-spill"
          )
          for relative in "${candidate_platform_tools[@]}"; do
            tool="$GITHUB_WORKSPACE/kandelo-source/$relative"
            test -f "$tool" && test ! -L "$tool" && test -x "$tool"
            tool_sha256="$(/usr/bin/sha256sum "$tool" | /usr/bin/awk '{print $1}')"
            [[ "$tool_sha256" =~ ^[0-9a-f]{64}$ ]]
            staged="$tool.abi-staging-staged"
            test ! -e "$staged" && test ! -L "$staged"
            /usr/bin/sudo -n /usr/bin/install -o root -g root -m 0555 -- \
              "$tool" "$staged"
            test "$(/usr/bin/stat -c '%u:%g:%a:%h' "$staged")" = "0:0:555:1"
            test "$(/usr/bin/sha256sum "$staged" | /usr/bin/awk '{print $1}')" = \
              "$tool_sha256"
            /usr/bin/sudo -n /usr/bin/mv -f -- "$staged" "$tool"
            test "$(/usr/bin/stat -c '%u:%g:%a:%h' "$tool")" = "0:0:555:1"
            test "$(/usr/bin/sha256sum "$tool" | /usr/bin/awk '{print $1}')" = \
              "$tool_sha256"
          done
          /usr/bin/sudo -n /usr/bin/chown root:root -- \
            "$GITHUB_WORKSPACE/kandelo-source" \
            "$GITHUB_WORKSPACE/kandelo-source/tools" \
            "$GITHUB_WORKSPACE/kandelo-source/tools/bin"
          /usr/bin/sudo -n /usr/bin/chmod 0755 -- \
            "$GITHUB_WORKSPACE/kandelo-source" \
            "$GITHUB_WORKSPACE/kandelo-source/tools" \
            "$GITHUB_WORKSPACE/kandelo-source/tools/bin"
          for directory in \
            "$GITHUB_WORKSPACE/kandelo-source" \
            "$GITHUB_WORKSPACE/kandelo-source/tools" \
            "$GITHUB_WORKSPACE/kandelo-source/tools/bin"; do
            test "$(/usr/bin/stat -c '%u:%g:%a' "$directory")" = "0:0:755"
          done

          test "$(git -C "$brew_repository" rev-parse HEAD)" = \
            "$HOMEBREW_BREW_COMMIT"
          test -z "$(git -C "$brew_repository" status --short --untracked-files=no)"
          {
            echo "HOMEBREW_BREW_FILE=$brew_bin"
            echo "HOMEBREW_BREW_COMMIT=$HOMEBREW_BREW_COMMIT"
            echo "HOMEBREW_CACHE=$shared_temp/cache"
            echo "HOMEBREW_TEMP=$shared_temp/tmp"
            echo "HOMEBREW_NO_AUTO_UPDATE=1"
            echo "HOMEBREW_NO_INSTALL_CLEANUP=1"
            echo "HOMEBREW_NO_ANALYTICS=1"
            echo "HOMEBREW_DEVELOPER=1"
            echo "KANDELO_HOMEBREW_RESOLVED_TAPS_FILE=$resolved_taps"
            echo "KANDELO_HOMEBREW_TAP_SOURCE_COMMIT=$KANDELO_ABI_STAGING_TAP_COMMIT"
            echo "KANDELO_HOMEBREW_BUILD_USER=$build_user"
            echo "KANDELO_HOMEBREW_RECIPE_USER=$recipe_user"
            echo "KANDELO_HOMEBREW_SHARED_TEMP=$shared_temp"
            echo "KANDELO_HOMEBREW_SUDO_BIN=/usr/bin/sudo"
            echo "KANDELO_HOMEBREW_SYSTEMD_RUN_BIN=/usr/bin/systemd-run"
            echo "KANDELO_HOMEBREW_SYSTEMCTL_BIN=/usr/bin/systemctl"
            echo "KANDELO_HOMEBREW_GETENT_BIN=/usr/bin/getent"
            echo "KANDELO_HOMEBREW_PGREP_BIN=/usr/bin/pgrep"
            echo "KANDELO_HOMEBREW_PKILL_BIN=/usr/bin/pkill"
            echo "PLAYWRIGHT_BROWSERS_PATH=$playwright_browsers"
            echo "WASM_POSIX_BINARY_CACHE_ROOT=$package_cache"
            echo "WASM_POSIX_XTASK_BIN=$candidate_xtask"
          } >>"$GITHUB_ENV"

      - name: Build one exact uncredentialed candidate handoff
        working-directory: kandelo-source
        env:
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN \
            scripts/dev-shell.sh env \
              "HOMEBREW_BREW_FILE=$HOMEBREW_BREW_FILE" \
              "HOMEBREW_BREW_COMMIT=$HOMEBREW_BREW_COMMIT" \
              "HOMEBREW_CACHE=$HOMEBREW_CACHE" \
              "HOMEBREW_TEMP=$HOMEBREW_TEMP" \
              "HOMEBREW_NO_AUTO_UPDATE=$HOMEBREW_NO_AUTO_UPDATE" \
              "HOMEBREW_NO_INSTALL_CLEANUP=$HOMEBREW_NO_INSTALL_CLEANUP" \
              "HOMEBREW_NO_ANALYTICS=$HOMEBREW_NO_ANALYTICS" \
              "HOMEBREW_DEVELOPER=$HOMEBREW_DEVELOPER" \
              "KANDELO_HOMEBREW_RESOLVED_TAPS_FILE=$KANDELO_HOMEBREW_RESOLVED_TAPS_FILE" \
              "KANDELO_HOMEBREW_TAP_SOURCE_COMMIT=$KANDELO_HOMEBREW_TAP_SOURCE_COMMIT" \
              "KANDELO_HOMEBREW_BUILD_USER=$KANDELO_HOMEBREW_BUILD_USER" \
              "KANDELO_HOMEBREW_RECIPE_USER=$KANDELO_HOMEBREW_RECIPE_USER" \
              "KANDELO_HOMEBREW_SHARED_TEMP=$KANDELO_HOMEBREW_SHARED_TEMP" \
              "KANDELO_HOMEBREW_SUDO_BIN=$KANDELO_HOMEBREW_SUDO_BIN" \
              "KANDELO_HOMEBREW_SYSTEMD_RUN_BIN=$KANDELO_HOMEBREW_SYSTEMD_RUN_BIN" \
              "KANDELO_HOMEBREW_SYSTEMCTL_BIN=$KANDELO_HOMEBREW_SYSTEMCTL_BIN" \
              "KANDELO_HOMEBREW_GETENT_BIN=$KANDELO_HOMEBREW_GETENT_BIN" \
              "KANDELO_HOMEBREW_PGREP_BIN=$KANDELO_HOMEBREW_PGREP_BIN" \
              "KANDELO_HOMEBREW_PKILL_BIN=$KANDELO_HOMEBREW_PKILL_BIN" \
              "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
              "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
              "WASM_POSIX_XTASK_BIN=$WASM_POSIX_XTASK_BIN" \
              "PYTHONDONTWRITEBYTECODE=1" \
              "PYTHONSAFEPATH=1" \
              "PYTHONPATH=$GITHUB_WORKSPACE/tap-authority" \
            python3 -P -m scripts.abi_staging.cli execute-build-work \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --out "$RUNNER_TEMP/handoff"

      - name: Upload exact inert build handoff
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-build-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish:
    name: publish-candidate ${{ inputs.work-id }}
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: "1.3.3"

      - name: Publish only protected reconstructions of inert data
        working-directory: tap-authority
        env:
          COORDINATION_ARTIFACT_DIGEST: ${{ inputs.coordination-artifact-digest }}
          COORDINATION_ARTIFACT_ID: ${{ inputs.coordination-artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_GITHUB_PACKAGES_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ vars.HOMEBREW_GITHUB_PACKAGES_USER }}
          PRODUCER_CONCLUSION: ${{ needs.build.result }}
          TAP_COMMIT: ${{ inputs.tap-commit }}
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-candidate \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$TAP_COMMIT" \
            --work-id "$WORK_ID" \
            --coordination-artifact-id "$COORDINATION_ARTIFACT_ID" \
            --coordination-artifact-digest "$COORDINATION_ARTIFACT_DIGEST" \
            --producer-conclusion "$PRODUCER_CONCLUSION" \
            --handoff-artifact-id "$HANDOFF_ARTIFACT_ID" \
            --handoff-artifact-digest "$HANDOFF_ARTIFACT_DIGEST" \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/candidate-publication.json"

      - name: Upload exact candidate locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-candidate-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
