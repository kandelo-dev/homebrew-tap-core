name: Publish Homebrew closed selection

on:
  workflow_dispatch:
    inputs:
      expected_caller_sha:
        description: >-
          Exact protected-main tap commit observed before dispatch
        required: true
        type: string
      selection_plan:
        description: Canonical compact JSON selecting one complete closure
        required: true
        type: string
      selection_plan_sha256:
        description: SHA-256 of the canonical selection plan
        required: true
        type: string

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    # WHY: this caller is protected data-only authority. Kandelo owns every
    # executable step and rechecks both protected main branches before writes.
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-closed-selection-publish.yml@333011ee523ce7344d00bf930b607009ada46d03
    with:
      expected-caller-sha: ${{ inputs.expected_caller_sha }}
      kandelo-ref: 333011ee523ce7344d00bf930b607009ada46d03
      selection-plan: ${{ inputs.selection_plan }}
      selection-plan-sha256: ${{ inputs.selection_plan_sha256 }}
