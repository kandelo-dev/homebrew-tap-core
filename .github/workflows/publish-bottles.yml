name: Publish Kandelo bottles
run-name: Publish Kandelo bottles / ${{ github.event.client_payload.formulae }} / ${{ github.event.client_payload.dispatch_token || 'untracked' }}

on:
  repository_dispatch:
    types: [publish-kandelo-bottles]

jobs:
  publish:
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@85d2efccdf55f02eb23fde4e9a3d075a4b267104
    with:
      kandelo-repository: Automattic/kandelo
      # WHY: publication authority and package generation are admitted together
      # on Kandelo main. Pinning both inputs prevents a later mutable ref from
      # changing either the publisher implementation or its package closure.
      kandelo-ref: 85d2efccdf55f02eb23fde4e9a3d075a4b267104
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      # WHY: repository_dispatch loads this caller from main, but Formula
      # source must remain the exact reviewed snapshot the controller approved.
      tap-ref: ${{ github.event.client_payload.tap_sha }}
      formulae: ${{ github.event.client_payload.formulae }}
      arches: ${{ github.event.client_payload.arches || 'wasm32' }}
      release-tag: ${{ github.event.client_payload.release_tag || '' }}
      expected-cache-keys: ${{ github.event.client_payload.expected_cache_keys || '' }}
      force: ${{ github.event.client_payload.force || false }}
      dry-run: false
      require-vfs-acceptance: ${{ github.event.client_payload.require_vfs_acceptance || false }}
      # WHY: this content-addressed, main-admitted generation is the immutable
      # package input for the bounded wasm32 rootfs lane. A preserved staging
      # tag is promotion evidence, not publication authority.
      package-generation-wasm32: package-generation-rootfs-wasm32-abi-v42-sha256-613e991e18f041467d3c27e92ef049718705deebce2b2d53c9639531e90fedc5
