name: Publish one ABI candidate reuse binding

on:
  workflow_call:
    inputs:
      coordination-artifact-id:
        required: true
        type: string
      coordination-artifact-digest:
        required: true
        type: string
      tap-commit:
        required: true
        type: string
      work-id:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: publish-reuse ${{ inputs.work-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Publish only an exact protected reuse binding
        working-directory: tap-authority
        env:
          COORDINATION_ARTIFACT_DIGEST: ${{ inputs.coordination-artifact-digest }}
          COORDINATION_ARTIFACT_ID: ${{ inputs.coordination-artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          TAP_COMMIT: ${{ inputs.tap-commit }}
          WORK_ID: ${{ inputs.work-id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-reuse \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$TAP_COMMIT" \
            --work-id "$WORK_ID" \
            --coordination-artifact-id "$COORDINATION_ARTIFACT_ID" \
            --coordination-artifact-digest "$COORDINATION_ARTIFACT_DIGEST" \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/reuse-publication.json"

      - name: Upload exact reuse locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-reuse-${{ inputs.work-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reuse-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
