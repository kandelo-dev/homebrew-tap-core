name: Reset failed ABI 43 private attempt packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact one-time reset confirmation
        required: true
        type: string

permissions: {}

jobs:
  reset-private-attempts:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'delete-abi43-private-attempts-20260814' &&
      github.repository == 'kandelo-dev/homebrew-tap-core' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete only the failed private ABI 43 attempt packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          names = (
              "homebrew-tap-core-abi-43-candidates/bc/attempts",
              "homebrew-tap-core-abi-43-candidates/bzip2/attempts",
              "homebrew-tap-core-abi-43-candidates/coreutils/attempts",
              "homebrew-tap-core-abi-43-candidates/dash/attempts",
              "homebrew-tap-core-abi-43-candidates/ed/attempts",
              "homebrew-tap-core-abi-43-candidates/fbdoom/attempts",
              "homebrew-tap-core-abi-43-candidates/gawk/attempts",
              "homebrew-tap-core-abi-43-candidates/grep/attempts",
              "homebrew-tap-core-abi-43-candidates/gzip/attempts",
              "homebrew-tap-core-abi-43-candidates/libcxx/attempts",
              "homebrew-tap-core-abi-43-candidates/libyaml/attempts",
              "homebrew-tap-core-abi-43-candidates/login/attempts",
              "homebrew-tap-core-abi-43-candidates/lsof/attempts",
              "homebrew-tap-core-abi-43-candidates/modeset/attempts",
              "homebrew-tap-core-abi-43-candidates/netcat/attempts",
              "homebrew-tap-core-abi-43-candidates/openssl/attempts",
          )
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, url: str) -> tuple[int, bytes]:
              operation = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(operation, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          deleted = 0
          for name in names:
              encoded = urllib.parse.quote(name, safe="")
              url = (
                  "https://api.github.com/orgs/kandelo-dev/packages/container/"
                  + encoded
              )
              status, body = request("GET", url)
              if status == 404:
                  print(f"already absent: {name}")
                  continue
              if status != 200:
                  raise SystemExit(f"metadata read failed for {name}: HTTP {status}")
              package = json.loads(body)
              if (
                  package.get("name") != name
                  or package.get("package_type") != "container"
                  or package.get("visibility") != "private"
                  or (package.get("repository") or {}).get("full_name")
                  != "kandelo-dev/homebrew-tap-core"
                  or not (
                      "2026-08-14T08:00:00Z"
                      <= package.get("created_at", "")
                      <= "2026-08-14T08:20:00Z"
                  )
              ):
                  raise SystemExit(f"refusing unexpected package metadata for {name}")
              status, _ = request("DELETE", url)
              if status != 204:
                  raise SystemExit(f"deletion failed for {name}: HTTP {status}")
              status, _ = request("GET", url)
              if status != 404:
                  raise SystemExit(f"deleted package remains visible for {name}: HTTP {status}")
              deleted += 1
              print(f"deleted: {name}")

          if deleted == 0:
              raise SystemExit("no failed private attempt packages were present")
          print(f"deleted {deleted} failed private attempt packages")
          PY
