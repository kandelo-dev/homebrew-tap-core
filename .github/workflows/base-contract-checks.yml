name: Base-controlled tap contract checks

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  publisher-trust-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.4"
      - name: Materialize candidate contracts as inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/materialize-tap-contract-candidate.sh
      - name: Validate candidate with the base-owned parser
        shell: bash
        run: ruby Kandelo/test-workflow-trust.rb "$KANDELO_TAP_CONTRACT_CANDIDATE"
