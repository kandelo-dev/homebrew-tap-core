          path: tap-authority

      - name: Check out exact Kandelo PR head as inert promotion input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-head }}
          fetch-depth: 1
          persist-credentials: false
          path: kandelo-source

      - name: Download exact protected coordination
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/promotion-inputs/coordination
          merge-multiple: true

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Plan one bounded promotion wave from public facts
        id: plan
        working-directory: tap-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli plan-workflow-promotion \
            --coordination-root "$RUNNER_TEMP/promotion-inputs/coordination" \
            --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
            --tap-root "$PWD" \
            --require-merged \
            --require-history-record \
            --github-output "$GITHUB_OUTPUT" \
            --out "$RUNNER_TEMP/promotion-plan"

      - name: Upload exact protected promotion plan
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-promotion-plan-${{ needs.discover-plan.outputs.request-digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-plan
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish-canonical:
    name: publish canonical bottle ${{ matrix.work_id }}
    needs: [discover-plan, plan-promotion]
    if: always() && needs.plan-promotion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan-promotion.outputs.canonical-matrix) }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: "1.3.3"

      - name: Publish only the unchanged candidate bottle layer
        working-directory: tap-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          WORK_ID: ${{ matrix.work_id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-canonical \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "${{ needs.discover-plan.outputs.tap-commit }}" \
            --request-digest "${{ needs.discover-plan.outputs.request-digest }}" \
            --work-id "$WORK_ID" \
            --plan-artifact-id "${{ needs.plan-promotion.outputs.artifact-id }}" \
            --plan-artifact-digest "${{ needs.plan-promotion.outputs.artifact-digest }}" \
            --require-unchanged-layer \
            --require-history-barrier \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/canonical-publication.json"

      - name: Upload exact canonical readback locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-canonical-${{ matrix.work_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  update-tap-metadata:
    name: update tap metadata ${{ matrix.work_id }}
    needs: [discover-plan, plan-promotion, publish-canonical]
    if: always() && needs.plan-promotion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-promotion.outputs.metadata-matrix) }}
    steps:
      - name: Check out exact protected tap revision for compare-and-swap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 0
          persist-credentials: true
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Apply one contents-only metadata compare-and-swap
        working-directory: tap-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_ID: ${{ matrix.work_id }}
          OPERATION: ${{ matrix.operation }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli update-workflow-tap-metadata \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "${{ needs.discover-plan.outputs.tap-commit }}" \
            --request-digest "${{ needs.discover-plan.outputs.request-digest }}" \
            --work-id "$WORK_ID" \
            --operation "$OPERATION" \
            --plan-artifact-id "${{ needs.plan-promotion.outputs.artifact-id }}" \
            --plan-artifact-digest "${{ needs.plan-promotion.outputs.artifact-digest }}" \
            --contents-only \
            --normal-push \
            --post-write-readback \
            --require-history-barrier \
            --out "$RUNNER_TEMP/metadata-readback.json"

      - name: Upload exact landed metadata readback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-metadata-${{ matrix.work_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metadata-readback.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish-admission:
    name: publish admission ${{ matrix.work_id }}
    needs: [discover-plan, plan-promotion, publish-canonical, update-tap-metadata]
    if: always() && needs.plan-promotion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan-promotion.outputs.admission-matrix) }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out current public tap metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: tap-metadata

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: "1.3.3"

      - name: Publish admission after exact landed metadata readback
        working-directory: tap-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          WORK_ID: ${{ matrix.work_id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-admission \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "${{ needs.discover-plan.outputs.tap-commit }}" \
            --request-digest "${{ needs.discover-plan.outputs.request-digest }}" \
            --work-id "$WORK_ID" \
            --plan-artifact-id "${{ needs.plan-promotion.outputs.artifact-id }}" \
            --plan-artifact-digest "${{ needs.plan-promotion.outputs.artifact-digest }}" \
            --metadata-root "$GITHUB_WORKSPACE/tap-metadata" \
            --require-metadata-readback \
            --require-history-barrier \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/admission-publication.json"

      - name: Upload exact admission locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-admission-${{ matrix.work_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
