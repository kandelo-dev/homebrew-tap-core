name: Reconcile ABI staging requests

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      request_asset_url:
        description: "One exact public request asset URL; empty scans the feed"
        required: false
        type: string

permissions: {}

concurrency:
  group: abi-staging-reconcile-${{ github.event_name }}-${{ inputs.request_asset_url || 'scan' }}
  cancel-in-progress: false

jobs:
  discover-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.coordinate.outputs.mode || steps.discover.outputs.mode }}
      build-matrix: ${{ steps.coordinate.outputs.build_matrix || steps.discover.outputs.build_matrix }}
      verify-matrix: ${{ steps.coordinate.outputs.verify_matrix || steps.discover.outputs.verify_matrix }}
      coordination-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      coordination-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      kandelo-head: ${{ steps.discover.outputs.kandelo_head }}
      kandelo-policy-commit: ${{ steps.discover.outputs.kandelo_policy_commit }}
      kandelo-repository: ${{ steps.discover.outputs.kandelo_repository }}
      tap-commit: ${{ steps.discover.outputs.tap_commit }}
    steps:
      - name: Check out protected tap main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Discover one exact request
        id: discover
        working-directory: tap-authority
        env:
          REQUEST_ASSET_URL: ${{ inputs.request_asset_url }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/abi-staging-coordination"
          python3 -m scripts.abi_staging.cli discover-workflow-request \
            --tap-root "$PWD" \
            --request-asset-url "$REQUEST_ASSET_URL" \
            --cycle-index "$GITHUB_RUN_NUMBER" \
            --github-output "$GITHUB_OUTPUT" \
            --out "$out"

      - name: Check out exact Kandelo PR head
        if: steps.discover.outputs.selected == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.discover.outputs.kandelo_repository }}
          ref: ${{ steps.discover.outputs.kandelo_head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        if: steps.discover.outputs.selected == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.discover.outputs.kandelo_repository }}
          ref: ${{ steps.discover.outputs.kandelo_policy_commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Set up immutable Kandelo policy tools
        if: steps.discover.outputs.selected == 'true'
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Derive Formula roots from exact selected VFS products
        id: requirements
        if: steps.discover.outputs.selected == 'true'
        working-directory: kandelo-authority
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/abi-staging-coordination"
          classes="$RUNNER_TEMP/abi-staging-change-classes.json"
          products="$RUNNER_TEMP/abi-staging-selected-products.json"
          scripts/dev-shell.sh jq -cS '.requirements.change_classes' \
            "$out/request.json" >"$classes"
          host_target="$(scripts/dev-shell.sh rustc -vV | awk '/^host/ {print $2}')"
          scripts/dev-shell.sh cargo run --quiet -p xtask \
            --target "$host_target" -- abi-staging requirements \
            --catalog "$GITHUB_WORKSPACE/kandelo-source/images/vfs/products/generated/catalog.json" \
            --pages "$GITHUB_WORKSPACE/kandelo-source/apps/browser-demos/pages/kandelo/kernel-host/pages-vfs-products.toml" \
            --tests "$GITHUB_WORKSPACE/kandelo-source/tests/vfs-products.toml" \
            --change-classes "$classes" \
            --products-out "$products" \
            --formulae-out "$RUNNER_TEMP/abi-staging-formula-requirements.json"

      - name: Prepare exact protected coordination
        id: coordinate
        if: steps.discover.outputs.selected == 'true'
        working-directory: tap-authority
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/abi-staging-coordination"
          now="$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"))')"
          python3 -m scripts.abi_staging.cli prepare-workflow \
            --tap-root "$PWD" \
            --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
            --discovery "$out/discovery.json" \
            --request "$out/request.json" \
            --formula-requirements "$RUNNER_TEMP/abi-staging-formula-requirements.json" \
            --now "$now" \
            --github-output "$GITHUB_OUTPUT" \
            --out "$out"

      - name: Upload protected coordination data
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-coordination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abi-staging-coordination
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  build-candidate:
    name: build-candidate ${{ matrix.work_id }}
    needs: discover-plan
    if: needs.discover-plan.outputs.mode == 'active'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.build-matrix) }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out exact Kandelo PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-policy-commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Download exact protected coordination data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/coordination
          merge-multiple: true

      - name: Set up immutable Kandelo policy tools
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Build one exact uncredentialed candidate handoff
        working-directory: tap-authority
        env:
          WORK_ID: ${{ matrix.work_id }}
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ../kandelo-authority/scripts/dev-shell.sh \
            python3 -m scripts.abi_staging.cli execute-build-work \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --out "$RUNNER_TEMP/handoff"

      - name: Upload exact inert build handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-build-${{ matrix.work_id }}
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish-candidate:
    name: publish-candidate ${{ matrix.work_id }}
    needs: [discover-plan, build-candidate]
    if: always() && needs.discover-plan.outputs.mode == 'active'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.build-matrix) }}
    steps:
      - name: Check out protected tap main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Publish only protected reconstructions of inert data
        working-directory: tap-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          WORK_ID: ${{ matrix.work_id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-candidate \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --work-id "$WORK_ID" \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/candidate-publication.json"

      - name: Upload exact candidate locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-candidate-${{ matrix.work_id }}
          path: ${{ runner.temp }}/candidate-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  verify-candidate:
    name: verify-candidate ${{ matrix.work_id }}
    needs: discover-plan
    if: needs.discover-plan.outputs.mode == 'active'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.verify-matrix) }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out exact Kandelo PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-policy-commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Download exact protected coordination data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/coordination
          merge-multiple: true

      - name: Set up immutable Kandelo policy tools
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Verify one exact public candidate without credentials
        working-directory: tap-authority
        env:
          WORK_ID: ${{ matrix.work_id }}
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ../kandelo-authority/scripts/dev-shell.sh \
            python3 -m scripts.abi_staging.cli execute-verification-work \
              --coordination "$RUNNER_TEMP/coordination" \
              --work-id "$WORK_ID" \
              --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --out "$RUNNER_TEMP/verification"

      - name: Upload exact inert verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-verification-${{ matrix.work_id }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  publish-receipt:
    name: publish-receipt ${{ matrix.work_id }}
    needs: [discover-plan, verify-candidate]
    if: always() && needs.discover-plan.outputs.mode == 'active'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.verify-matrix) }}
    steps:
      - name: Check out protected tap main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Publish only a protected receipt reconstruction
        working-directory: tap-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          WORK_ID: ${{ matrix.work_id }}
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli publish-workflow-receipt \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --work-id "$WORK_ID" \
            --require-github-digest \
            --anonymous-readback \
            --immutable \
            --out "$RUNNER_TEMP/verification-publication.json"

      - name: Upload exact verification receipt locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-receipt-${{ matrix.work_id }}
          path: ${{ runner.temp }}/verification-publication.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0
