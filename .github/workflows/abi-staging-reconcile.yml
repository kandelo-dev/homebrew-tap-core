name: Reconcile ABI staging requests

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      request_asset_url:
        description: "One exact public request asset URL; empty scans the feed"
        required: false
        type: string
      retry_exhausted_builds:
        description: "Reschedule exhausted Formula builds for this manual run"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: abi-staging-reconcile-${{ github.event_name }}-${{ inputs.request_asset_url || 'scan' }}
  cancel-in-progress: false

jobs:
  discover-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.coordinate.outputs.mode || steps.discover.outputs.mode }}
      build-matrix: ${{ steps.coordinate.outputs.build_matrix || steps.discover.outputs.build_matrix }}
      reuse-matrix: ${{ steps.coordinate.outputs.reuse_matrix || steps.discover.outputs.reuse_matrix }}
      verify-matrix: ${{ steps.coordinate.outputs.verify_matrix || steps.discover.outputs.verify_matrix }}
      product-mode: ${{ steps.coordinate.outputs.product_mode || steps.discover.outputs.product_mode }}
      product-matrix: ${{ steps.coordinate.outputs.product_matrix || steps.discover.outputs.product_matrix }}
      node-evidence-matrix: ${{ steps.coordinate.outputs.node_evidence_matrix || steps.discover.outputs.node_evidence_matrix }}
      browser-evidence-matrix: ${{ steps.coordinate.outputs.browser_evidence_matrix || steps.discover.outputs.browser_evidence_matrix }}
      required-formulae-ready: ${{ steps.coordinate.outputs.required_formulae_ready || steps.discover.outputs.required_formulae_ready }}
      request-digest: ${{ steps.coordinate.outputs.request_digest || steps.discover.outputs.request_digest }}
      selected: ${{ steps.discover.outputs.selected }}
      coordination-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      coordination-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      kandelo-head: ${{ steps.discover.outputs.kandelo_head }}
      kandelo-policy-commit: ${{ steps.discover.outputs.kandelo_policy_commit }}
      kandelo-repository: ${{ steps.discover.outputs.kandelo_repository }}
      tap-commit: ${{ steps.discover.outputs.tap_commit }}
      promotion-eligible: ${{ steps.discover.outputs.promotion_eligible }}
    steps:
      - name: Check out protected tap main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Discover one exact request
        id: discover
        working-directory: tap-authority
        env:
          REQUEST_ASSET_URL: ${{ inputs.request_asset_url }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/abi-staging-coordination"
          python3 -m scripts.abi_staging.cli discover-workflow-request \
            --tap-root "$PWD" \
            --request-asset-url "$REQUEST_ASSET_URL" \
            --cycle-index "$GITHUB_RUN_NUMBER" \
            --github-output "$GITHUB_OUTPUT" \
            --out "$out"

      - name: Check out exact Kandelo PR head
        if: steps.discover.outputs.selected == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.discover.outputs.kandelo_repository }}
          ref: ${{ steps.discover.outputs.kandelo_head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        if: steps.discover.outputs.selected == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.discover.outputs.kandelo_repository }}
          ref: ${{ steps.discover.outputs.kandelo_policy_commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Set up immutable Kandelo policy tools
        if: steps.discover.outputs.selected == 'true'
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Derive Formula roots from exact selected VFS products
        id: requirements
        if: steps.discover.outputs.selected == 'true'
        working-directory: kandelo-authority
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/abi-staging-coordination"
          classes="$RUNNER_TEMP/abi-staging-change-classes.json"
          products="$RUNNER_TEMP/abi-staging-selected-products.json"
          # The positional parameters expand in the nested declared shell.
          # shellcheck disable=SC2016
          scripts/dev-shell.sh bash -c '
            set -euo pipefail
            jq -cS ".requirements.change_classes" "$1" >"$2"
          ' -- "$out/request.json" "$classes"
          host_target="$(scripts/dev-shell.sh rustc -vV | awk '/^host/ {print $2}')"
          scripts/dev-shell.sh cargo run --quiet -p xtask \
            --target "$host_target" -- abi-staging requirements \
            --catalog "$GITHUB_WORKSPACE/kandelo-source/images/vfs/products/generated/catalog.json" \
            --pages "$GITHUB_WORKSPACE/kandelo-source/apps/browser-demos/pages/kandelo/kernel-host/pages-vfs-products.toml" \
            --tests "$GITHUB_WORKSPACE/kandelo-source/tests/vfs-products.toml" \
            --change-classes "$classes" \
            --products-out "$products" \
            --formulae-out "$RUNNER_TEMP/abi-staging-formula-requirements.json"

      - name: Prepare exact protected coordination
        id: coordinate
        if: steps.discover.outputs.selected == 'true'
        working-directory: tap-authority
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/abi-staging-coordination"
          now="$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"))')"
          retry_args=()
          if [[ "${{ inputs.retry_exhausted_builds }}" == "true" ]]; then
            retry_args+=(--retry-exhausted-builds)
          fi
          python3 -m scripts.abi_staging.cli prepare-workflow \
            --tap-root "$PWD" \
            --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
            --discovery "$out/discovery.json" \
            --request "$out/request.json" \
            --formula-requirements "$RUNNER_TEMP/abi-staging-formula-requirements.json" \
            --now "$now" \
            "${retry_args[@]}" \
            --github-output "$GITHUB_OUTPUT" \
            --out "$out"

      - name: Upload protected coordination data
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-coordination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abi-staging-coordination
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  prepare-homebrew-realm:
    needs: discover-plan
    if: >-
      needs.discover-plan.outputs.mode == 'active' &&
      (fromJSON(needs.discover-plan.outputs.build-matrix).include[0] != null ||
      fromJSON(needs.discover-plan.outputs.verify-matrix).include[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-realm.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-realm.outputs.artifact-digest }}
      archive-sha256: ${{ steps.realm-identity.outputs.archive_sha256 }}
      source-tree: ${{ steps.realm-identity.outputs.source_tree }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out exact Kandelo PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Derive exact shared Homebrew realm cache identity
        id: realm-cache-key
        env:
          KANDELO_COMMIT: ${{ needs.discover-plan.outputs.kandelo-head }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          tap-authority/scripts/abi-staging-homebrew-realm-cache-key.sh \
            --tap-root "$GITHUB_WORKSPACE/tap-authority" \
            --kandelo-commit "$KANDELO_COMMIT" \
            --runner-os "$RUNNER_OS_NAME" \
            --runner-arch "$RUNNER_ARCH_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore exact shared Homebrew realm cache
        id: restore-realm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shared-homebrew-realm.tar.zst
          key: ${{ steps.realm-cache-key.outputs.cache_key }}

      - name: Migrate exact compatible Homebrew realm cache
        id: restore-legacy-realm-cache
        if: steps.restore-realm-cache.outputs.cache-hit != 'true' && steps.realm-cache-key.outputs.legacy_cache_key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shared-homebrew-realm.tar.zst
          key: ${{ steps.realm-cache-key.outputs.legacy_cache_key }}

      - name: Set up exact Kandelo build tools
        if: steps.restore-realm-cache.outputs.cache-hit != 'true' && steps.restore-legacy-realm-cache.outputs.cache-hit != 'true'
        uses: ./kandelo-source/.github/actions/setup-nix

      - name: Prepare one shared uncredentialed Homebrew realm
        if: steps.restore-realm-cache.outputs.cache-hit != 'true' && steps.restore-legacy-realm-cache.outputs.cache-hit != 'true'
        working-directory: kandelo-source
        run: |
          set -euo pipefail
          playwright_browsers="$PWD/.ci-homebrew-realm/ms-playwright"
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN -u GITHUB_ENV -u GITHUB_OUTPUT \
            -u GITHUB_STEP_SUMMARY \
            scripts/dev-shell.sh env \
              "PYTHONDONTWRITEBYTECODE=1" \
              bash "$GITHUB_WORKSPACE/tap-authority/scripts/abi-staging-prepare-shared-homebrew-realm.sh" \
                --source-root "$PWD" \
                --playwright-browsers "$playwright_browsers"

      - name: Pack exact shared Homebrew realm
        if: steps.restore-realm-cache.outputs.cache-hit != 'true' && steps.restore-legacy-realm-cache.outputs.cache-hit != 'true'
        working-directory: kandelo-source
        env:
          EXPECTED_COMMIT: ${{ needs.discover-plan.outputs.kandelo-head }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shared-homebrew-realm.tar.zst"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          scripts/dev-shell.sh bash \
            "$GITHUB_WORKSPACE/tap-authority/scripts/abi-staging-pack-homebrew-realm.sh" \
              --source-root "$PWD" \
              --expected-commit "$EXPECTED_COMMIT" \
              --expected-tree "$source_tree" \
              --archive "$archive"

      - name: Derive exact shared Homebrew realm identity
        id: realm-identity
        working-directory: kandelo-source
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shared-homebrew-realm.tar.zst"
          [[ -f "$archive" && ! -L "$archive" ]]
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "archive_sha256=$archive_sha256"
            echo "source_tree=$source_tree"
          } >>"$GITHUB_OUTPUT"

      - name: Save exact shared Homebrew realm cache
        id: save-realm-cache
        if: steps.restore-realm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shared-homebrew-realm.tar.zst
          key: ${{ steps.realm-cache-key.outputs.cache_key }}

      - name: Upload exact shared Homebrew realm
        id: upload-realm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-homebrew-realm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-homebrew-realm.tar.zst
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

  candidate:
    name: candidate ${{ matrix.work_id }}
    needs: [discover-plan, prepare-homebrew-realm]
    if: needs.discover-plan.outputs.mode == 'active' && needs.prepare-homebrew-realm.result == 'success'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.build-matrix) }}
    uses: ./.github/workflows/abi-staging-candidate.yml
    with:
      coordination-artifact-id: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
      coordination-artifact-digest: ${{ needs.discover-plan.outputs.coordination-artifact-digest }}
      kandelo-head: ${{ needs.discover-plan.outputs.kandelo-head }}
      kandelo-policy-commit: ${{ needs.discover-plan.outputs.kandelo-policy-commit }}
      kandelo-repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
      tap-commit: ${{ needs.discover-plan.outputs.tap-commit }}
      realm-artifact-id: ${{ needs.prepare-homebrew-realm.outputs.artifact-id }}
      realm-artifact-digest: ${{ needs.prepare-homebrew-realm.outputs.artifact-digest }}
      realm-archive-sha256: ${{ needs.prepare-homebrew-realm.outputs.archive-sha256 }}
      realm-source-tree: ${{ needs.prepare-homebrew-realm.outputs['source-tree'] }}
      work-id: ${{ matrix.work_id }}
  verification:
    name: verification ${{ matrix.work_id }}
    needs: [discover-plan, prepare-homebrew-realm]
    if: needs.discover-plan.outputs.mode == 'active' && needs.prepare-homebrew-realm.result == 'success'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.verify-matrix) }}
    uses: ./.github/workflows/abi-staging-verification.yml
    with:
      coordination-artifact-id: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
      coordination-artifact-digest: ${{ needs.discover-plan.outputs.coordination-artifact-digest }}
      kandelo-head: ${{ needs.discover-plan.outputs.kandelo-head }}
      kandelo-policy-commit: ${{ needs.discover-plan.outputs.kandelo-policy-commit }}
      kandelo-repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
      tap-commit: ${{ needs.discover-plan.outputs.tap-commit }}
      realm-artifact-id: ${{ needs.prepare-homebrew-realm.outputs.artifact-id }}
      realm-artifact-digest: ${{ needs.prepare-homebrew-realm.outputs.artifact-digest }}
      realm-archive-sha256: ${{ needs.prepare-homebrew-realm.outputs.archive-sha256 }}
      realm-source-tree: ${{ needs.prepare-homebrew-realm.outputs['source-tree'] }}
      work-id: ${{ matrix.work_id }}
  reuse:
    name: reuse ${{ matrix.work_id }}
    needs: discover-plan
    if: needs.discover-plan.outputs.mode == 'active'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover-plan.outputs.reuse-matrix) }}
    uses: ./.github/workflows/abi-staging-reuse.yml
    with:
      coordination-artifact-id: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
      coordination-artifact-digest: ${{ needs.discover-plan.outputs.coordination-artifact-digest }}
      tap-commit: ${{ needs.discover-plan.outputs.tap-commit }}
      work-id: ${{ matrix.work_id }}
  prepare-runtime:
    name: prepare exact runtime
    needs: discover-plan
    if: >-
      needs.discover-plan.outputs.selected == 'true' &&
      needs.discover-plan.outputs.required-formulae-ready == 'true' &&
      (fromJSON(needs.discover-plan.outputs.product-matrix).include[0] != null ||
      fromJSON(needs.discover-plan.outputs.node-evidence-matrix).include[0] != null ||
      fromJSON(needs.discover-plan.outputs.browser-evidence-matrix).include[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact Kandelo PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-head }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-source

      - name: Check out immutable Kandelo policy tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-policy-commit }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: kandelo-authority

      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Download exact protected coordination data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.discover-plan.outputs.coordination-artifact-id }}
          path: ${{ runner.temp }}/coordination
          merge-multiple: true

      - name: Set up immutable Kandelo policy tools
        uses: ./kandelo-authority/.github/actions/setup-nix

      - name: Export exact protected runtime identity
        working-directory: kandelo-authority
        run: |
          set -euo pipefail
          scripts/dev-shell.sh env \
            "PYTHONPATH=$GITHUB_WORKSPACE/tap-authority" \
            python3 -m scripts.abi_staging.cli export-runtime-realm \
              --coordination "$RUNNER_TEMP/coordination" \
              --tap-root "$GITHUB_WORKSPACE/tap-authority" \
              --github-env "$GITHUB_ENV"

      - name: Isolate exact runtime package resolution
        run: |
          set -euo pipefail
          package_cache="$RUNNER_TEMP/abi-staging-runtime-package-cache"
          test ! -e "$package_cache"
          mkdir -m 0700 "$package_cache"
          echo "WASM_POSIX_BINARY_CACHE_ROOT=$package_cache" >>"$GITHUB_ENV"

      - name: Build one exact uncredentialed runtime
        working-directory: kandelo-authority
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN \
            scripts/dev-shell.sh npm --prefix apps/browser-demos install --prefer-offline
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -u ACTIONS_RUNTIME_TOKEN \
            scripts/dev-shell.sh env \
              "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
              scripts/abi-staging-prepare-runtime.sh \
              --source-root "$GITHUB_WORKSPACE/kandelo-source" \
              --source-repository "${{ needs.discover-plan.outputs.kandelo-repository }}" \
              --source-commit "${{ needs.discover-plan.outputs.kandelo-head }}" \
              --source-tree "$KANDELO_ABI_STAGING_SOURCE_TREE" \
              --target-abi "$KANDELO_ABI_STAGING_TARGET_ABI" \
              --snapshot-sha256 "$KANDELO_ABI_STAGING_SNAPSHOT_SHA256" \
              --build-policy-sha256 "$KANDELO_ABI_STAGING_BUILD_POLICY_SHA256" \
              --binary-cache-root "$WASM_POSIX_BINARY_CACHE_ROOT" \
              --out "$RUNNER_TEMP/exact-runtime"

      - name: Upload exact inert runtime
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-runtime-${{ needs.discover-plan.outputs.request-digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

  plan-products:
    name: plan dependency-ready product wave
    needs: [discover-plan, candidate, verification, reuse, prepare-runtime]
    if: always() && needs.discover-plan.outputs.selected == 'true' && needs.prepare-runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      product-matrix: ${{ steps.plan.outputs.product_matrix }}
      node-evidence-matrix: ${{ steps.plan.outputs.node_evidence_matrix }}
      browser-evidence-matrix: ${{ steps.plan.outputs.browser_evidence_matrix }}
    steps:
      - name: Check out exact protected tap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover-plan.outputs.tap-commit }}
          fetch-depth: 1
          persist-credentials: false
          path: tap-authority

      - name: Check out exact Kandelo PR head as inert data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.discover-plan.outputs.kandelo-repository }}
          ref: ${{ needs.discover-plan.outputs.kandelo-head }}
          fetch-depth: 1
          persist-credentials: false
          path: kandelo-source

      - name: Download exact protected coordination
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abi-staging-coordination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-planning/coordination

      - name: Download exact runtime identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abi-staging-runtime-${{ needs.discover-plan.outputs.request-digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-planning/runtime

      - name: Set up declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Derive one bounded product DAG wave from public facts
        id: plan
        working-directory: tap-authority
        run: |
          set -euo pipefail
          python3 -m scripts.abi_staging.cli plan-workflow-products \
            --coordination-root "$RUNNER_TEMP/product-planning/coordination" \
            --runtime-root "$RUNNER_TEMP/product-planning/runtime" \
            --kandelo-root "$GITHUB_WORKSPACE/kandelo-source" \
            --tap-root "$PWD" \
