name: Publish Homebrew main-shell mirror

on:
  repository_dispatch:
    types: [publish-homebrew-main-shell-mirror]

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    # WHY: the reusable workflow owns every executable step and derives TA1
    # from this protected caller's live-main SHA. Keeping all four input
    # identities literal prevents event data from selecting code or artifacts.
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-main-shell-mirror-publish.yml@c5a24dc148b2e69c0555d9e7802bee7cd48a18d7
    with:
      kandelo-ref: c5a24dc148b2e69c0555d9e7802bee7cd48a18d7
      # WHY: TF owns the reviewed bottle catalog, while TA0 owns the existing
      # immutable mirror. TA1 may publish only the lifecycle-input release.
      tap-catalog-ref: 6ad0e3dbc60e5572c4288c86919238f71c1bc110
      mirror-authority-ref: 08f8f32c94bee8d6fc2948e453e53ece29b1c8e1
      # WHY: third-party installation must use an immutable revision from a
      # genuinely independent public tap.
      canary-ref: d8bdda662f6d80cf3dcdbe8451edb12bb33bbafc
