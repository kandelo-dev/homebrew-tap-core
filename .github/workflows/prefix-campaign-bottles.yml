# Publish one content-addressed prefix-campaign Formula handoff.
#
# WHY: one reviewed task keeps dependency order explicit. A partial
# campaign can never become tap Git authority.
name: Publish prefix-campaign bottle

on:
  repository_dispatch:
    types: [publish-prefix-campaign-bottle]

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      admission-kind: ${{ steps.admit.outputs.admission-kind }}
      arch: ${{ steps.admit.outputs.arch }}
      arches: ${{ steps.admit.outputs.arches }}
      campaign-tag: ${{ steps.authority.outputs.campaign-tag }}
      dependencies: ${{ steps.admit.outputs.dependencies }}
      disposition: ${{ steps.admit.outputs.disposition }}
      formula: ${{ steps.admit.outputs.formula }}
      generation-kind: ${{ steps.admit.outputs.generation-kind }}
      generation-wasm32: ${{ steps.admit.outputs.generation-wasm32 }}
      generation-wasm64: ${{ steps.admit.outputs.generation-wasm64 }}
      kandelo-commit: ${{ steps.authority.outputs.kandelo-commit }}
      old-tap-commit: ${{ steps.admit.outputs.old-tap-commit }}
      release-tag: ${{ steps.authority.outputs.release-tag }}
      rootfs-wasm32-generation: >-
        ${{ steps.authority.outputs.rootfs-wasm32-generation }}
      source-tap-commit: >-
        ${{ steps.authority.outputs.source-tap-commit }}
    steps:
      - name: Checkout protected caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Admit protected authority and event shape
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py preflight \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Kandelo executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Automattic/kandelo
          ref: ${{ steps.authority.outputs.kandelo-commit }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Checkout exact campaign source tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ steps.authority.outputs.source-tap-commit }}
          path: source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Admit one exact campaign task
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py admit \
            --kandelo-root kandelo \
            --source-tap-root source-tap \
            --event "$GITHUB_EVENT_PATH" \
            --out "$RUNNER_TEMP/campaign-task.json" \
            --github-output "$GITHUB_OUTPUT"

  publish-rootfs:
    needs: [admit]
    if: >-
      ${{
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind == 'anonymous-absence'
      }}
    # WHY: the reusable publisher declares conditional tap-finalization and
    # VFS-release jobs with `contents: write`. GitHub validates the caller's
    # permission ceiling before it evaluates their false input conditions.
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@d0c70caae68dd3c69632dea9f145a3bf31b499b8
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formulae: ${{ needs.admit.outputs.formula }}
      arches: ${{ needs.admit.outputs.arches }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      expected-cache-keys: ""
      package-generation-wasm32: >-
        ${{ needs.admit.outputs.rootfs-wasm32-generation }}
      force: true
      dry-run: false
      require-vfs-acceptance: false
      defer-tap-finalization: true
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  build-bootstrap-rootfs:
    # WHY: an anonymous GHCR authentication challenge cannot distinguish a
    # package that does not exist from a private package. Build first without
    # package authority so the credentialed phase receives only sealed bytes.
    # Kandelo gives these artifacts a bootstrap-only name because the ordinary
    # publisher later emits its normal artifacts in this same workflow run.
    needs: [admit]
    if: >-
      ${{
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind ==
          'first-package-namespace-bootstrap-required'
      }}
    # WHY: dry-run keeps the write jobs skipped, but GitHub still requires the
    # caller ceiling to cover every permission declared by the reusable.
    permissions:
      actions: read
      contents: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@d0c70caae68dd3c69632dea9f145a3bf31b499b8
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formulae: ${{ needs.admit.outputs.formula }}
      arches: ${{ needs.admit.outputs.arches }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      expected-cache-keys: ""
      package-generation-wasm32: >-
        ${{ needs.admit.outputs.rootfs-wasm32-generation }}
      force: true
      dry-run: true
      require-vfs-acceptance: false
      defer-tap-finalization: true
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  publish-first-child:
    # WHY: creating the first child makes the package namespace public, but it
    # does not create Homebrew's version index. This reusable may write only
    # that child (or resume by anonymously proving the exact child is public).
    needs: [admit, build-bootstrap-rootfs]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        needs.build-bootstrap-rootfs.result == 'success' &&
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind ==
          'first-package-namespace-bootstrap-required'
      }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-prefix-first-child-publish.yml@d0c70caae68dd3c69632dea9f145a3bf31b499b8
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formula: ${{ needs.admit.outputs.formula }}
      arch: ${{ needs.admit.outputs.arch }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  publish-bootstrap-rootfs:
    # WHY: Formula finalization needs the ordinary public version index,
    # sidecar inputs, and verification handoff. Run the regular publisher only
    # after the bounded first-child gate; its handoff is the one sealed below.
    needs: [admit, publish-first-child]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        needs.publish-first-child.result == 'success' &&
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind ==
          'first-package-namespace-bootstrap-required'
      }}
    # WHY: this call needs the same reusable-workflow ceiling described by
    # publish-rootfs, even though campaign inputs skip both write jobs.
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@d0c70caae68dd3c69632dea9f145a3bf31b499b8
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formulae: ${{ needs.admit.outputs.formula }}
      arches: ${{ needs.admit.outputs.arches }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      expected-cache-keys: ""
      package-generation-wasm32: >-
        ${{ needs.admit.outputs.rootfs-wasm32-generation }}
      force: true
      dry-run: false
      require-vfs-acceptance: false
      defer-tap-finalization: true
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  seal-handoff:
    needs:
      - admit
      - publish-rootfs
      - build-bootstrap-rootfs
      - publish-first-child
      - publish-bootstrap-rootfs
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        (
          (
            needs.admit.outputs.disposition == 'build' &&
            needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
            (
              (
                needs.admit.outputs.admission-kind ==
                  'anonymous-absence' &&
                needs.publish-rootfs.result == 'success' &&
                needs.build-bootstrap-rootfs.result == 'skipped' &&
                needs.publish-first-child.result == 'skipped' &&
                needs.publish-bootstrap-rootfs.result == 'skipped'
              ) || (
                needs.admit.outputs.admission-kind ==
                  'first-package-namespace-bootstrap-required' &&
                needs.publish-rootfs.result == 'skipped' &&
                needs.build-bootstrap-rootfs.result == 'success' &&
                needs.publish-first-child.result == 'success' &&
                needs.publish-bootstrap-rootfs.result == 'success'
              )
            )
          ) || (
            needs.admit.outputs.disposition == 'reuse' &&
            needs.publish-rootfs.result == 'skipped' &&
            needs.build-bootstrap-rootfs.result == 'skipped' &&
            needs.publish-first-child.result == 'skipped' &&
            needs.publish-bootstrap-rootfs.result == 'skipped' &&
            needs.admit.outputs.generation-kind == 'none'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout protected caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout exact Kandelo executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Automattic/kandelo
          ref: ${{ needs.admit.outputs.kandelo-commit }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Checkout exact campaign source tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.admit.outputs.source-tap-commit }}
          path: source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact historical tap for reuse
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.admit.outputs.old-tap-commit }}
          path: old-tap
          persist-credentials: false

      - name: Download admitted publication handoff
        if: ${{ needs.admit.outputs.disposition == 'build' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: >-
            homebrew-publish-handoff-${{ needs.admit.outputs.formula }}-${{ needs.admit.outputs.arch }}-attempt-${{ github.run_attempt }}
          path: >-
            ${{ runner.temp }}/campaign-publications/${{ needs.admit.outputs.arch }}

      - name: Derive and prepare immutable Formula handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          cd kandelo
          controller=(
            python3
            "$GITHUB_WORKSPACE/scripts/prefix-campaign-controller.py"
          )
          common=(
            --kandelo-root "$GITHUB_WORKSPACE/kandelo"
            --source-tap-root "$GITHUB_WORKSPACE/source-tap"
            --event "$GITHUB_EVENT_PATH"
            --out "$RUNNER_TEMP/prepared-handoff-release"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "${{ needs.admit.outputs.disposition }}" = reuse ]; then
            controller+=(prepare-reuse)
            common+=(--old-tap-root "$GITHUB_WORKSPACE/old-tap")
          else
            controller+=(prepare-build)
            common+=(
              --publications-root
              "$RUNNER_TEMP/campaign-publications"
            )
          fi
          bash scripts/dev-shell.sh "${controller[@]}" "${common[@]}"

      - name: Publish immutable Formula handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # WHY: credentials enter only after all task data is sealed.
          # A campaign may outlive later Kandelo merges. Each release
          # therefore re-proves that its sealed source remains on
          # protected main.
          bash kandelo/scripts/publish-immutable-github-release.sh \
            --manifest \
              "$RUNNER_TEMP/prepared-handoff-release/release-manifest.json" \
            --asset-root \
              "$RUNNER_TEMP/prepared-handoff-release/assets" \
            --lock-root source-tap \
            --receipt "$RUNNER_TEMP/publish-receipt.json" \
            --kandelo-main-contains-sha \
              "${{ needs.admit.outputs.kandelo-commit }}" \
            --target-main-contains-sha \
              "${{ needs.admit.outputs.source-tap-commit }}"

      - name: Revalidate the release without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py verify-release \
            --kandelo-root kandelo \
            --source-tap-root source-tap \
            --event "$GITHUB_EVENT_PATH" \
            --tag "${{ steps.handoff.outputs.handoff-tag }}" \
            --out "$RUNNER_TEMP/readback-handoff"

      - name: Retain bounded controller evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            prefix-campaign-controller-${{ needs.admit.outputs.formula }}-${{ needs.admit.outputs.arch }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-summary.json
            ${{ runner.temp }}/publish-receipt.json
            ${{ runner.temp }}/readback-receipt.json
            ${{ runner.temp }}/readback-summary.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
