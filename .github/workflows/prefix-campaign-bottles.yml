# Publish one content-addressed prefix-campaign bottle identity and handoff.
#
# WHY: one reviewed task keeps dependency order explicit. Each successful
# bottle remains independently usable, while a partial campaign can never
# become tap Git authority.
name: Publish prefix-campaign bottle

on:
  repository_dispatch:
    types:
      - publish-prefix-campaign-bottle

jobs:
  admit:
    if: ${{ github.event.action == 'publish-prefix-campaign-bottle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      admission-kind: ${{ steps.admit.outputs.admission-kind }}
      arch: ${{ steps.admit.outputs.arch }}
      arches: ${{ steps.admit.outputs.arches }}
      campaign-tag: ${{ steps.authority.outputs.campaign-tag }}
      dependencies: ${{ steps.admit.outputs.dependencies }}
      disposition: ${{ steps.admit.outputs.disposition }}
      formula: ${{ steps.admit.outputs.formula }}
      generation-kind: ${{ steps.admit.outputs.generation-kind }}
      generation-wasm32: ${{ steps.admit.outputs.generation-wasm32 }}
      generation-wasm64: ${{ steps.admit.outputs.generation-wasm64 }}
      kandelo-commit: ${{ steps.authority.outputs.kandelo-commit }}
      old-tap-commit: ${{ steps.admit.outputs.old-tap-commit }}
      recovery-tap-commit: >-
        ${{ steps.admit.outputs.recovery-tap-commit }}
      release-tag: ${{ steps.authority.outputs.release-tag }}
      rootfs-wasm32-generation: >-
        ${{ steps.authority.outputs.rootfs-wasm32-generation }}
      source-tap-commit: >-
        ${{ steps.authority.outputs.source-tap-commit }}
    steps:
      - name: Checkout protected caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Admit protected authority and event shape
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py preflight \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Kandelo executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Automattic/kandelo
          ref: ${{ steps.authority.outputs.kandelo-commit }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Checkout exact campaign source tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ steps.authority.outputs.source-tap-commit }}
          path: source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Admit one exact campaign task
        id: admit
        shell: bash
        env:
          # WHY: internal release metadata reads must not consume the shared
          # anonymous GitHub API quota used by hosted runner addresses.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py admit \
            --kandelo-root kandelo \
            --source-tap-root source-tap \
            --event "$GITHUB_EVENT_PATH" \
            --out "$RUNNER_TEMP/campaign-task.json" \
            --github-output "$GITHUB_OUTPUT"

  publish-rootfs:
    needs: [admit]
    if: >-
      ${{
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind == 'anonymous-absence'
      }}
    # WHY: the reusable publisher declares conditional tap-finalization and
    # VFS-release jobs with `contents: write`. GitHub validates the caller's
    # permission ceiling before it evaluates their false input conditions.
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@333011ee523ce7344d00bf930b607009ada46d03
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formulae: ${{ needs.admit.outputs.formula }}
      arches: ${{ needs.admit.outputs.arches }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      expected-cache-keys: ""
      package-generation-wasm32: >-
        ${{ needs.admit.outputs.rootfs-wasm32-generation }}
      force: true
      dry-run: false
      require-vfs-acceptance: false
      defer-tap-finalization: true
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  build-bootstrap-rootfs:
    # WHY: an anonymous GHCR authentication challenge cannot distinguish a
    # package that does not exist from a private package. Build first without
    # package authority so the credentialed phase receives only sealed bytes.
    # Kandelo gives these artifacts a bootstrap-only name because the ordinary
    # publisher later emits its normal artifacts in this same workflow run.
    needs: [admit]
    if: >-
      ${{
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind ==
          'first-package-namespace-bootstrap-required'
      }}
    # WHY: dry-run keeps the write jobs skipped, but GitHub still requires the
    # caller ceiling to cover every permission declared by the reusable. The
    # nested build job remains read-only; it does not inherit this whole cap.
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@333011ee523ce7344d00bf930b607009ada46d03
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formulae: ${{ needs.admit.outputs.formula }}
      arches: ${{ needs.admit.outputs.arches }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      expected-cache-keys: ""
      package-generation-wasm32: >-
        ${{ needs.admit.outputs.rootfs-wasm32-generation }}
      force: true
      dry-run: true
      require-vfs-acceptance: false
      defer-tap-finalization: true
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  publish-first-child:
    # WHY: creating the first child makes the package namespace public, but it
    # does not create Homebrew's version index. This reusable may write only
    # that child (or resume by anonymously proving the exact child is public).
    needs: [admit, build-bootstrap-rootfs]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        needs.build-bootstrap-rootfs.result == 'success' &&
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind ==
          'first-package-namespace-bootstrap-required'
      }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-prefix-first-child-publish.yml@333011ee523ce7344d00bf930b607009ada46d03
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formula: ${{ needs.admit.outputs.formula }}
      arch: ${{ needs.admit.outputs.arch }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  publish-bootstrap-rootfs:
    # WHY: Formula finalization needs the ordinary public version index,
    # sidecar inputs, and verification handoff. Run the regular publisher only
    # after the bounded first-child gate; its handoff is the one sealed below.
    needs: [admit, publish-first-child]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        needs.publish-first-child.result == 'success' &&
        needs.admit.outputs.disposition == 'build' &&
        needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
        needs.admit.outputs.admission-kind ==
          'first-package-namespace-bootstrap-required'
      }}
    # WHY: this call needs the same reusable-workflow ceiling described by
    # publish-rootfs, even though campaign inputs skip both write jobs.
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@333011ee523ce7344d00bf930b607009ada46d03
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ needs.admit.outputs.kandelo-commit }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ needs.admit.outputs.source-tap-commit }}
      formulae: ${{ needs.admit.outputs.formula }}
      arches: ${{ needs.admit.outputs.arches }}
      release-tag: ${{ needs.admit.outputs.release-tag }}
      expected-cache-keys: ""
      package-generation-wasm32: >-
        ${{ needs.admit.outputs.rootfs-wasm32-generation }}
      force: true
      dry-run: false
      require-vfs-acceptance: false
      defer-tap-finalization: true
      prefix-campaign-tag: ${{ needs.admit.outputs.campaign-tag }}
      prefix-campaign-dependencies: >-
        ${{ needs.admit.outputs.dependencies }}

  seal-handoff:
    needs:
      - admit
      - publish-rootfs
      - build-bootstrap-rootfs
      - publish-first-child
      - publish-bootstrap-rootfs
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        (
          (
            needs.admit.outputs.disposition == 'build' &&
            needs.admit.outputs.generation-kind == 'rootfs-wasm32' &&
            (
              (
                needs.admit.outputs.admission-kind ==
                  'anonymous-absence' &&
                needs.publish-rootfs.result == 'success' &&
                needs.build-bootstrap-rootfs.result == 'skipped' &&
                needs.publish-first-child.result == 'skipped' &&
                needs.publish-bootstrap-rootfs.result == 'skipped'
              ) || (
                needs.admit.outputs.admission-kind ==
                  'first-package-namespace-bootstrap-required' &&
                needs.publish-rootfs.result == 'skipped' &&
                needs.build-bootstrap-rootfs.result == 'success' &&
                needs.publish-first-child.result == 'success' &&
                needs.publish-bootstrap-rootfs.result == 'success'
              )
            )
          ) || (
            needs.admit.outputs.disposition == 'reuse' &&
            needs.publish-rootfs.result == 'skipped' &&
            needs.build-bootstrap-rootfs.result == 'skipped' &&
            needs.publish-first-child.result == 'skipped' &&
            needs.publish-bootstrap-rootfs.result == 'skipped' &&
            needs.admit.outputs.generation-kind == 'none'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # WHY: reuse writes the same Formula repository and mutable version
      # index as an ordinary build. Sharing its lock prevents lost sibling
      # descriptors when two independently valid children finish together.
      group: kandelo-homebrew-ghcr-${{ needs.admit.outputs.formula }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout protected caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout exact Kandelo executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Automattic/kandelo
          ref: ${{ needs.admit.outputs.kandelo-commit }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Checkout exact campaign source tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.admit.outputs.source-tap-commit }}
          path: source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact historical tap for reuse
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.admit.outputs.old-tap-commit }}
          path: old-tap
          # WHY: a bottle may record Formula bytes from an older commit.
          # Keep history so the executor can verify that exact source.
          fetch-depth: 0
          persist-credentials: false

      - name: Download admitted publication handoff
        if: ${{ needs.admit.outputs.disposition == 'build' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: >-
            homebrew-publish-handoff-${{ needs.admit.outputs.formula }}-${{ needs.admit.outputs.arch }}-attempt-${{ github.run_attempt }}
          path: >-
            ${{ runner.temp }}/campaign-publications/${{ needs.admit.outputs.arch }}

      - name: Install Nix for handoff derivation
        # WHY: reuse skips the reusable publisher, so this job cannot inherit
        # its Nix installation. The controller still runs through Kandelo's
        # declared dev shell to use the reviewed Python and tool versions.
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Derive immutable Formula handoff and reused OCI child
        id: handoff
        shell: bash
        env:
          # WHY: dependency handoffs are internal controller inputs. The
          # controller forwards this token only to their release reads.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd kandelo
          controller=(
            python3
            "$GITHUB_WORKSPACE/scripts/prefix-campaign-controller.py"
          )
          common=(
            --kandelo-root "$GITHUB_WORKSPACE/kandelo"
            --source-tap-root "$GITHUB_WORKSPACE/source-tap"
            --event "$GITHUB_EVENT_PATH"
            --out "$RUNNER_TEMP/prepared-handoff-release"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "${{ needs.admit.outputs.disposition }}" = reuse ]; then
            controller+=(prepare-reuse)
            common+=(--old-tap-root "$GITHUB_WORKSPACE/old-tap")
          else
            controller+=(prepare-build)
            common+=(
              --publications-root
              "$RUNNER_TEMP/campaign-publications"
            )
          fi
          bash scripts/dev-shell.sh "${controller[@]}" "${common[@]}"

      - name: Validate the reused OCI child without credentials
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        shell: bash
        env:
          ARCH: ${{ needs.admit.outputs.arch }}
          FORMULA: ${{ needs.admit.outputs.formula }}
          KANDELO_COMMIT: ${{ needs.admit.outputs.kandelo-commit }}
          RELEASE_TAG: ${{ needs.admit.outputs.release-tag }}
          TAP_COMMIT: ${{ needs.admit.outputs.source-tap-commit }}
        run: |
          set -euo pipefail
          for secret_name in GH_TOKEN GITHUB_TOKEN \
            HOMEBREW_GITHUB_API_TOKEN HOMEBREW_GITHUB_PACKAGES_TOKEN \
            HOMEBREW_DOCKER_REGISTRY_TOKEN; do
            [ -z "${!secret_name:-}" ] || {
              echo "::error::reuse child validator received $secret_name"
              exit 2
            }
          done
          child="$RUNNER_TEMP/prepared-handoff-release/reuse-oci"
          cd kandelo
          bash scripts/dev-shell.sh python3 \
            scripts/homebrew-oci-layout.py validate-child \
            --layout "$child/layout" \
            --receipt "$child/receipt.json"
          jq -e \
            --arg arch "$ARCH" \
            --arg formula "$FORMULA" \
            --arg abi "${RELEASE_TAG#bottles-abi-v}" \
            --arg kandelo_commit "$KANDELO_COMMIT" \
            --arg tap_commit "$TAP_COMMIT" '
              .schema == 2 and .kind == "child" and
              .arch == $arch and .formula == $formula and
              .abi == ($abi | tonumber) and
              .kandelo_commit == $kandelo_commit and
              .tap_commit == $tap_commit and
              (.tap_repository | ascii_downcase) ==
                "kandelo-dev/homebrew-tap-core" and
              (.tap_name | ascii_downcase) == "kandelo-dev/tap-core"
            ' "$child/receipt.json" >/dev/null

      - name: Publish or resume the exact reused OCI child
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        shell: bash
        env:
          FORMULA: ${{ needs.admit.outputs.formula }}
          GH_TOKEN: ${{ github.token }}
          KANDELO_COMMIT: ${{ needs.admit.outputs.kandelo-commit }}
          TAP_COMMIT: ${{ needs.admit.outputs.source-tap-commit }}
        run: |
          set -euo pipefail
          child="$RUNNER_TEMP/prepared-handoff-release/reuse-oci"
          cd kandelo
          bash .github/scripts/require-repository-main-contains.sh \
            --repository Automattic/kandelo \
            --source-sha "$KANDELO_COMMIT"
          bash scripts/dev-shell.sh bash scripts/homebrew-ghcr-upload.sh \
            --layout "$child/layout" \
            --layout-receipt "$child/receipt.json" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core \
            --formula "$FORMULA" \
            --kandelo-main-contains-sha "$KANDELO_COMMIT" \
            --target-main-contains-sha "$TAP_COMMIT" \
            --auth-mode github-token \
            --require-pat false \
            --destination-mode repository \
            --out-json "$RUNNER_TEMP/reuse-child-publication.json"

      - name: Revalidate public reused child evidence without credentials
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        shell: bash
        env:
          FORMULA: ${{ needs.admit.outputs.formula }}
        run: |
          set -euo pipefail
          child="$RUNNER_TEMP/prepared-handoff-release/reuse-oci"
          cd kandelo
          bash scripts/dev-shell.sh python3 \
            scripts/homebrew-oci-layout.py validate-publication-receipt \
            --receipt "$RUNNER_TEMP/reuse-child-publication.json" \
            --layout-receipt "$child/receipt.json" \
            --kind child \
            --formula "$FORMULA" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core

      - name: Compose the public Homebrew version index without credentials
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        shell: bash
        env:
          FORMULA: ${{ needs.admit.outputs.formula }}
          TAP_COMMIT: ${{ needs.admit.outputs.source-tap-commit }}
        run: |
          set -euo pipefail
          for secret_name in GH_TOKEN GITHUB_TOKEN \
            HOMEBREW_GITHUB_API_TOKEN HOMEBREW_GITHUB_PACKAGES_TOKEN \
            HOMEBREW_DOCKER_REGISTRY_TOKEN; do
            [ -z "${!secret_name:-}" ] || {
              echo "::error::reuse index composer received $secret_name"
              exit 2
            }
          done
          child="$RUNNER_TEMP/prepared-handoff-release/reuse-oci"
          existing="$RUNNER_TEMP/reuse-existing-index"
          result="$RUNNER_TEMP/reuse-existing-index-result.json"
          config="$RUNNER_TEMP/reuse-anonymous-oras.json"
          top_ref="$(jq -er .top_ref "$child/receipt.json")"
          printf '{"auths":{}}\n' >"$config"
          cd kandelo
          bash scripts/dev-shell.sh env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN python3 \
            scripts/homebrew-oci-layout.py import-public-index \
            --remote \
              "ghcr.io/kandelo-dev/homebrew-tap-core/$FORMULA" \
            --reference "$top_ref" \
            --registry-config "$config" \
            --out-layout "$existing" \
            --out-result "$result"
          merge_args=(
            --child-layout "$child/layout"
            --child-receipt "$child/receipt.json"
          )
          case "$(jq -er .status "$result")" in
            present) merge_args+=(--existing-layout "$existing") ;;
            missing) ;;
            *) echo "::error::invalid anonymous version-index import"; exit 1 ;;
          esac
          bash scripts/dev-shell.sh python3 \
            scripts/homebrew-oci-layout.py merge-index \
            "${merge_args[@]}" \
            --tap-commit "$TAP_COMMIT" \
            --out-layout "$RUNNER_TEMP/reuse-complete-index/layout" \
            --out-receipt \
              "$RUNNER_TEMP/reuse-complete-index/layout-receipt.json"

      - name: Publish the reused bottle version index
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        shell: bash
        env:
          FORMULA: ${{ needs.admit.outputs.formula }}
          GH_TOKEN: ${{ github.token }}
          KANDELO_COMMIT: ${{ needs.admit.outputs.kandelo-commit }}
          TAP_COMMIT: ${{ needs.admit.outputs.source-tap-commit }}
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/reuse-complete-index"
          cd kandelo
          # WHY: the child is independently public before this mutable
          # version index changes. An index race can therefore never discard
          # the successfully reused bottle bytes.
          bash scripts/dev-shell.sh bash scripts/homebrew-ghcr-upload.sh \
            --layout "$index/layout" \
            --layout-receipt "$index/layout-receipt.json" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core \
            --formula "$FORMULA" \
            --kandelo-main-contains-sha "$KANDELO_COMMIT" \
            --target-main-contains-sha "$TAP_COMMIT" \
            --auth-mode github-token \
            --require-pat false \
            --destination-mode repository \
            --out-json "$index/transport-receipt.json"

      - name: Revalidate public version-index evidence without credentials
        if: ${{ needs.admit.outputs.disposition == 'reuse' }}
        shell: bash
        env:
          FORMULA: ${{ needs.admit.outputs.formula }}
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/reuse-complete-index"
          cd kandelo
          bash scripts/dev-shell.sh python3 \
            scripts/homebrew-oci-layout.py validate-publication-receipt \
            --receipt "$index/transport-receipt.json" \
            --layout-receipt "$index/layout-receipt.json" \
            --kind index \
            --formula "$FORMULA" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core

      - name: Publish immutable Formula handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # WHY: handoff-release credentials enter only after the child and
          # index are publicly readable. A campaign may outlive later Kandelo
          # merges, so each release also re-proves that its sealed source
          # remains on protected main.
          bash kandelo/scripts/publish-immutable-github-release.sh \
            --manifest \
              "$RUNNER_TEMP/prepared-handoff-release/release-manifest.json" \
            --asset-root \
              "$RUNNER_TEMP/prepared-handoff-release/assets" \
            --lock-root source-tap \
            --receipt "$RUNNER_TEMP/publish-receipt.json" \
            --kandelo-main-contains-sha \
              "${{ needs.admit.outputs.kandelo-commit }}" \
            --target-main-contains-sha \
              "${{ needs.admit.outputs.source-tap-commit }}"

      - name: Revalidate public release assets
        shell: bash
        env:
          # WHY: authenticate only GitHub's release-metadata request so a
          # shared hosted runner cannot exhaust the small anonymous API quota.
          # The verifier never sends this token when it downloads release
          # assets, so the handoff bytes must still be publicly readable.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py verify-release \
            --kandelo-root kandelo \
            --source-tap-root source-tap \
            --event "$GITHUB_EVENT_PATH" \
            --tag "${{ steps.handoff.outputs.handoff-tag }}" \
            --out "$RUNNER_TEMP/readback-handoff"

      - name: Retain bounded controller evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            prefix-campaign-controller-${{ needs.admit.outputs.formula }}-${{ needs.admit.outputs.arch }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-summary.json
            ${{ runner.temp }}/publish-receipt.json
            ${{ runner.temp }}/readback-receipt.json
            ${{ runner.temp }}/readback-summary.json
            ${{ runner.temp }}/prepared-handoff-release/reuse-oci/receipt.json
            ${{ runner.temp }}/reuse-child-publication.json
            ${{ runner.temp }}/reuse-complete-index/layout-receipt.json
            ${{ runner.temp }}/reuse-complete-index/transport-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  reseal-predecessor-handoff:
    # WHY: predecessor bottles and their version indexes are already public.
    # A separate contents-only job makes it impossible for this path to write
    # GHCR while it binds the existing bytes to the current campaign.
    needs:
      - admit
      - publish-rootfs
      - build-bootstrap-rootfs
      - publish-first-child
      - publish-bootstrap-rootfs
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.admit.result == 'success' &&
        needs.admit.outputs.disposition == 'predecessor-reuse' &&
        needs.admit.outputs.generation-kind == 'none' &&
        needs.admit.outputs.admission-kind ==
          'archived-predecessor-exact-presence' &&
        needs.publish-rootfs.result == 'skipped' &&
        needs.build-bootstrap-rootfs.result == 'skipped' &&
        needs.publish-first-child.result == 'skipped' &&
        needs.publish-bootstrap-rootfs.result == 'skipped'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout protected caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout exact Kandelo executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Automattic/kandelo
          ref: ${{ needs.admit.outputs.kandelo-commit }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Checkout exact campaign source tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.admit.outputs.source-tap-commit }}
          path: source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact predecessor recovery archive
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.admit.outputs.recovery-tap-commit }}
          path: recovery-tap
          persist-credentials: false

      - name: Install Nix for handoff derivation
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Reseal exact predecessor bottle handoff
        id: handoff
        shell: bash
        env:
          # WHY: predecessor and dependency handoffs are internal controller
          # inputs. The controller forwards this token only to release reads.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd kandelo
          bash scripts/dev-shell.sh python3 \
            "$GITHUB_WORKSPACE/scripts/prefix-campaign-controller.py" \
            prepare-predecessor-reuse \
            --kandelo-root "$GITHUB_WORKSPACE/kandelo" \
            --source-tap-root "$GITHUB_WORKSPACE/source-tap" \
            --recovery-tap-root "$GITHUB_WORKSPACE/recovery-tap" \
            --event "$GITHUB_EVENT_PATH" \
            --out "$RUNNER_TEMP/prepared-handoff-release" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish immutable Formula handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # WHY: the bottle and index were verified in place. This is the
          # only mutation in the job, and it publishes current campaign
          # evidence rather than rewriting package bytes.
          bash kandelo/scripts/publish-immutable-github-release.sh \
            --manifest \
              "$RUNNER_TEMP/prepared-handoff-release/release-manifest.json" \
            --asset-root \
              "$RUNNER_TEMP/prepared-handoff-release/assets" \
            --lock-root source-tap \
            --receipt "$RUNNER_TEMP/publish-receipt.json" \
            --kandelo-main-contains-sha \
              "${{ needs.admit.outputs.kandelo-commit }}" \
            --target-main-contains-sha \
              "${{ needs.admit.outputs.source-tap-commit }}"

      - name: Revalidate public release assets
        shell: bash
        env:
          # WHY: authenticate GitHub release metadata only. Asset downloads
          # remain credential-free so the handoff must be publicly readable.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/prefix-campaign-controller.py verify-release \
            --kandelo-root kandelo \
            --source-tap-root source-tap \
            --event "$GITHUB_EVENT_PATH" \
            --tag "${{ steps.handoff.outputs.handoff-tag }}" \
            --out "$RUNNER_TEMP/readback-handoff"

      - name: Retain bounded controller evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            prefix-campaign-controller-${{ needs.admit.outputs.formula }}-${{ needs.admit.outputs.arch }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-summary.json
            ${{ runner.temp }}/publish-receipt.json
            ${{ runner.temp }}/readback-receipt.json
            ${{ runner.temp }}/readback-summary.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
